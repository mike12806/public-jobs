name: k3s secrets encryption

# Runs gh_hdc's ansible/playbooks/playbook_k3s_secrets_encryption.yaml: turns
# on k3s secrets encryption on the existing cluster (k3s's documented HA
# procedure: enable, flag on every server, restart them one at a time,
# rotate keys and re-encrypt every Secret, restart again, verify every Secret
# in etcd is encrypted). Resumes from wherever the cluster is; a run on a
# finished cluster changes nothing.
#
# Manual only; a dry run unless "apply" is ticked. Applying restarts each k3s
# server twice, one at a time (the API stays up through the VIP; pods keep
# running).
#
# Runs on a GitHub-hosted runner through Tailscale, independent of the
# cluster (as the etcd and migration workflows). This repo is public, so its
# logs are too: the playbook only ever prints counts and statuses.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply (unticked = dry run with --check)'
        type: boolean
        default: false
      gh_hdc_ref:
        description: 'gh_hdc branch/ref to run the playbook from'
        type: string
        default: main

concurrency:
  group: k3s_datastore_migration  # shares the lock with the migration: both restart the servers
  cancel-in-progress: false

permissions:
  id-token: write  # log in to Vault through GitHub OIDC
  contents: read

jobs:
  secrets-encryption:
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    steps:
      - name: Prefer IPv4 over IPv6
        run: |
          # Force IPv4 preference to avoid Tailscale IPv6 connectivity issues
          echo 'precedence ::ffff:0:0/96 100' | sudo tee -a /etc/gai.conf

      - name: Connect to Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd  # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: github-runner-k3s-secrets-encryption
          version: latest

      # vault.mfaherty.net is only in the LAN's DNS (Pi-hole), which partly
      # runs on Kubernetes. The GSLB VIP's HAProxy passes TLS through to Vault,
      # so the certificate is still checked against the name.
      - name: Pin vault.mfaherty.net to the GSLB VIP
        run: echo '192.168.1.113 vault.mfaherty.net' | sudo tee -a /etc/hosts

      - name: Read secrets from Vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc  # v4.0.0
        with:
          url: https://vault.mfaherty.net
          method: jwt
          path: github-actions
          role: public-jobs
          jwtGithubAudience: https://vault.mfaherty.net
          secrets: |
            kv/data/ci/github GH_HDC_PAT | GH_HDC_PAT ;
            kv/data/ci/ssh ANSIBLE_SSH_PASSWORD_1 | ANSIBLE_SSH_PASSWORD_1 ;
            kv/data/ci/ssh MIKEYSSHKEYLINODE | MIKEYSSHKEYLINODE

      - name: Checkout gh_hdc
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: mike12806/gh_hdc
          ref: ${{ inputs.gh_hdc_ref || 'main' }}
          token: ${{ env.GH_HDC_PAT }}
          path: gh_hdc

      - name: Cache pipx and ansible
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.local/bin
            ~/.local/pipx
          key: ${{ runner.os }}-pipx-ansible-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pipx-ansible-

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-pip python3 python3-venv pipx sshpass openssh-client
          pipx ensurepath
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # Root on the etcd LXCs and the k3s servers alike (as the etcd cluster
      # and k8s node update workflows).
      - name: Write SSH Private Key to File
        env:
          SSH_KEY: ${{ env.MIKEYSSHKEYLINODE }}
        run: |
          printf '%s\n' "$SSH_KEY" | sed 's/\\n/\n/g' > /tmp/mike_ssh_key
          chmod 600 /tmp/mike_ssh_key

      - name: Run Ansible Playbook
        id: playbook
        working-directory: gh_hdc/ansible
        env:
          ANSIBLE_SSH_PASS: ${{ env.ANSIBLE_SSH_PASSWORD_1 }}
          ANSIBLE_PRIVATE_KEY_FILE: /tmp/mike_ssh_key
          ANSIBLE_PYTHON_INTERPRETER: /usr/bin/python3
          ANSIBLE_GATHERING: smart
          ANSIBLE_TIMEOUT: 30
          ANSIBLE_STDOUT_CALLBACK: ansible.builtin.default
          ANSIBLE_CALLBACK_RESULT_FORMAT: yaml
          ANSIBLE_HOST_KEY_CHECKING: false
          APPLY: ${{ inputs.apply }}
        run: |
          set -o pipefail
          mode=(--check)
          if [ "$APPLY" = "true" ]; then
            mode=()
            echo "::notice::Applying: k3s servers restart one at a time."
          else
            echo "::notice::Dry run (--check). Re-run with 'apply' ticked to make changes."
          fi
          pipx run --spec ansible ansible-playbook playbooks/playbook_k3s_secrets_encryption.yaml \
            -i inventory/etcd_hosts \
            -u root \
            --private-key=/tmp/mike_ssh_key \
            "${mode[@]}" \
            --extra-vars "ansible_ssh_pass=${ANSIBLE_SSH_PASS} ansible_ssh_common_args='-o StrictHostKeyChecking=no'" \
            | tee "$RUNNER_TEMP/k3s.log"

      - name: Job summary
        if: always() && steps.playbook.outcome != 'skipped'
        env:
          OUTCOME: ${{ steps.playbook.outcome }}
        run: |
          {
            echo "### k3s secrets encryption ($([ '${{ inputs.apply }}' = 'true' ] && echo apply || echo dry run)): ${OUTCOME}"
            echo '```'
            grep -E '^ +msg:|^ +- ' "$RUNNER_TEMP/k3s.log" | sed -n '1,60p' || true
            sed -n '/^PLAY RECAP/,$p' "$RUNNER_TEMP/k3s.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup Temporary Files
        if: always()
        run: |
          rm -f /tmp/mike_ssh_key "$RUNNER_TEMP/k3s.log"
