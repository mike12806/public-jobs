name: PBS Incomplete Snapshot Cleanup

# Deletes the snapshots a cut backup leaves on PBS without a manifest, which
# make every verify job fail (gh_hdc playbook_pbs_incomplete_snapshots.yaml).
on:
  schedule:
    # Daily, 12:47 EST / 13:47 EDT: nightly backups are long finished and over
    # the playbook's 6h minimum age, and it's ahead of the evening verify jobs.
    - cron: "47 17 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report what would be deleted"
        type: boolean
        required: false
        default: false

concurrency:
  group: pbs_incomplete_snapshots
  cancel-in-progress: false

permissions:
  id-token: write  # log in to Vault through GitHub OIDC
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-26.04
    timeout-minutes: 30

    steps:
      # Same version as the ARC runner image. Installed before Tailscale, so pip
      # doesn't depend on tailnet DNS and third-party code runs off the tailnet.
      - name: Install Ansible
        env:
          ANSIBLE_VERSION: 15.0.0
          PIPX_HOME: ${{ runner.temp }}/pipx
          PIPX_BIN_DIR: ${{ runner.temp }}/pipx/bin
        run: |
          pipx install --include-deps "ansible==${ANSIBLE_VERSION}"
          echo "$PIPX_BIN_DIR" >> "$GITHUB_PATH"

      - name: Connect to Tailscale
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c  # v4.4.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: github-runner-pbs-cleanup
          version: latest

      # Secrets come from Vault (kv/ci/*), logged in through GitHub OIDC with
      # the role below (gh_hdc vault/), so they're no longer GitHub secrets.
      - name: Read secrets from Vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc  # v4.0.0
        with:
          url: https://vault.mfaherty.net
          method: jwt
          path: github-actions
          role: public-jobs
          jwtGithubAudience: https://vault.mfaherty.net
          secrets: |
            kv/data/ci/github GH_HDC_PAT | GH_HDC_PAT ;
            kv/data/ci/smtp EMAIL_FROM | EMAIL_FROM ;
            kv/data/ci/smtp EMAIL_TO | EMAIL_TO ;
            kv/data/ci/smtp SMTP_PASSWORD | SMTP_PASSWORD ;
            kv/data/ci/smtp SMTP_PORT | SMTP_PORT ;
            kv/data/ci/smtp SMTP_SERVER | SMTP_SERVER ;
            kv/data/ci/smtp SMTP_USERNAME | SMTP_USERNAME ;
            kv/data/ci/ssh ANSIBLE_SSH_PASSWORD_3 | ANSIBLE_SSH_PASSWORD_3 ;
            kv/data/ci/ssh MIKEYSSHKEYLINODE | MIKEYSSHKEYLINODE

      - name: Checkout gh_hdc
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: mike12806/gh_hdc
          token: ${{ env.GH_HDC_PAT }}
          path: gh_hdc

      - name: Write SSH Private Key to File
        run: |
          echo "${{ env.MIKEYSSHKEYLINODE }}" | sed 's/\\n/\n/g' > /tmp/mike_ssh_key
          chmod 600 /tmp/mike_ssh_key

      - name: Run Ansible Playbook
        working-directory: gh_hdc/ansible
        env:
          ANSIBLE_SSH_PASS_3: ${{ env.ANSIBLE_SSH_PASSWORD_3 }}
          ANSIBLE_PYTHON_INTERPRETER: /usr/bin/python3
          ANSIBLE_GATHERING: smart
          ANSIBLE_TIMEOUT: 30
          ANSIBLE_STDOUT_CALLBACK: ansible.builtin.default
          ANSIBLE_CALLBACK_RESULT_FORMAT: yaml
          ANSIBLE_HOST_KEY_CHECKING: false
          DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          ansible-playbook playbooks/playbook_pbs_incomplete_snapshots.yaml \
            -i inventory/proxmox_hosts \
            -u root \
            --private-key=/tmp/mike_ssh_key \
            --extra-vars "ansible_ssh_pass=${ANSIBLE_SSH_PASS_3} ansible_ssh_common_args='-o StrictHostKeyChecking=no'" \
            --extra-vars "pbs_cleanup_report=${RUNNER_TEMP}/pbs_cleanup_report.txt" \
            --extra-vars "pbs_cleanup_dry_run=${DRY_RUN}"

      # The playbook writes this report only when a snapshot was (or would be)
      # deleted, or something went wrong.
      - name: Check for a report
        id: report
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/pbs_cleanup_report.txt" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Email the cleanup report
        if: always() && steps.report.outputs.found == 'true'
        uses: dawidd6/action-send-mail@27bf7a883db6de205849f760badd38a1a3ce0dd0  # v24
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: ${{ env.SMTP_PORT }}
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: "🧹 PBS incomplete snapshot cleanup"
          body: file://${{ runner.temp }}/pbs_cleanup_report.txt
          to: ${{ env.EMAIL_TO }}
          from: ${{ env.EMAIL_FROM }}

      - name: Cleanup
        if: always()
        run: |
          rm -f /tmp/mike_ssh_key
          rm -f "$RUNNER_TEMP/pbs_cleanup_report.txt"
