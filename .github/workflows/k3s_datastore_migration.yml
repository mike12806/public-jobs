name: k3s datastore migration

# Runs gh_hdc's ansible/playbooks/playbook_k3s_datastore_migrate.yaml: moves
# the k3s servers' datastore from Postgres to the etcd cluster (gh_hdc
# ansible/inventory/etcd_hosts, groups [etcd] and [k3s_servers]), or back.
# Manual only. Run the modes in order and read each one's summary:
#
#   preflight  (default) reads only: etcd healthy and empty, where each
#              server's --datastore-endpoint is, object counts, the plan
#   rehearse   no downtime: tools, the k3s client certificates, a timed
#              pg_dump, and a full copy into etcd under a scratch prefix,
#              verified and deleted
#   migrate    DOWNTIME (confirm: MIGRATE): stops both k3s servers, final
#              pg_dump, copies and verifies, switches the endpoint, starts
#              them on etcd, verifies. A failure before the first server is
#              up on etcd puts both back on Postgres automatically.
#   rollback   (confirm: ROLLBACK): both servers back on Postgres from the
#              migration's backups
#
# See the playbook's header for the runbook, expected downtime and what's
# left for later.
#
# Runs on a GitHub-hosted runner and reaches the LAN through Tailscale. It
# must work while the Kubernetes API is down, so it uses nothing in the
# cluster: hosts by IP, vault.mfaherty.net pinned to the GSLB VIP rather
# than resolved through the LAN's DNS. No Proxmox access is needed.
#
# This repo is public, so its logs are too. The playbook reads the Postgres
# URL on the servers and keeps it there, copies the etcd CA key no_log, and
# prints key names only as /registry/<resource>; no --diff, default
# verbosity.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'preflight (read only), rehearse (no downtime), migrate (downtime), rollback'
        type: choice
        options: [preflight, rehearse, migrate, rollback]
        default: preflight
      confirm:
        description: 'Type MIGRATE for migrate, ROLLBACK for rollback; leave empty otherwise'
        type: string
        default: ''
      gh_hdc_ref:
        description: 'gh_hdc branch/ref to run the playbook from'
        type: string
        default: main

concurrency:
  group: k3s_datastore_migration
  cancel-in-progress: false  # never interrupt a cutover

permissions:
  id-token: write  # log in to Vault through GitHub OIDC
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-24.04
    # The copy is minutes for a homelab cluster; a long pg_dump or slow
    # starts still fit. The playbook's own waits are bounded well inside it.
    timeout-minutes: 180

    steps:
      - name: Check the confirmation
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          case "$MODE" in
            migrate)  [ "$CONFIRM" = "MIGRATE" ]  || { echo "::error::migrate needs confirm = MIGRATE"; exit 1; } ;;
            rollback) [ "$CONFIRM" = "ROLLBACK" ] || { echo "::error::rollback needs confirm = ROLLBACK"; exit 1; } ;;
            preflight|rehearse) [ -z "$CONFIRM" ] || echo "::notice::confirm is ignored for $MODE" ;;
            *) echo "::error::unknown mode $MODE"; exit 1 ;;
          esac
          echo "::notice::Mode: $MODE"

      - name: Prefer IPv4 over IPv6
        run: |
          # Force IPv4 preference to avoid Tailscale IPv6 connectivity issues
          echo 'precedence ::ffff:0:0/96 100' | sudo tee -a /etc/gai.conf

      - name: Connect to Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd  # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: github-runner-k3s-datastore
          version: latest

      # vault.mfaherty.net is only in the LAN's DNS (Pi-hole), which partly
      # runs on Kubernetes. The GSLB VIP's HAProxy passes TLS through to Vault,
      # so the certificate is still checked against the name.
      - name: Pin vault.mfaherty.net to the GSLB VIP
        run: echo '192.168.1.113 vault.mfaherty.net' | sudo tee -a /etc/hosts

      - name: Read secrets from Vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc  # v4.0.0
        with:
          url: https://vault.mfaherty.net
          method: jwt
          path: github-actions
          role: public-jobs
          jwtGithubAudience: https://vault.mfaherty.net
          secrets: |
            kv/data/ci/github GH_HDC_PAT | GH_HDC_PAT ;
            kv/data/ci/ssh ANSIBLE_SSH_PASSWORD_1 | ANSIBLE_SSH_PASSWORD_1 ;
            kv/data/ci/ssh MIKEYSSHKEYLINODE | MIKEYSSHKEYLINODE

      - name: Checkout gh_hdc
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: mike12806/gh_hdc
          ref: ${{ inputs.gh_hdc_ref || 'main' }}
          token: ${{ env.GH_HDC_PAT }}
          path: gh_hdc

      - name: Cache pipx and ansible
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.local/bin
            ~/.local/pipx
          key: ${{ runner.os }}-pipx-ansible-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pipx-ansible-

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-pip python3 python3-venv pipx sshpass openssh-client
          pipx ensurepath
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # Root on the etcd LXCs and the k3s servers alike (as the etcd cluster
      # and k8s node update workflows).
      - name: Write SSH Private Key to File
        env:
          SSH_KEY: ${{ env.MIKEYSSHKEYLINODE }}
        run: |
          printf '%s\n' "$SSH_KEY" | sed 's/\\n/\n/g' > /tmp/mike_ssh_key
          chmod 600 /tmp/mike_ssh_key

      - name: Run Ansible Playbook
        id: playbook
        working-directory: gh_hdc/ansible
        env:
          ANSIBLE_SSH_PASS: ${{ env.ANSIBLE_SSH_PASSWORD_1 }}
          ANSIBLE_PRIVATE_KEY_FILE: /tmp/mike_ssh_key
          ANSIBLE_PYTHON_INTERPRETER: /usr/bin/python3
          ANSIBLE_GATHERING: smart
          ANSIBLE_TIMEOUT: 30
          ANSIBLE_STDOUT_CALLBACK: ansible.builtin.default
          ANSIBLE_CALLBACK_RESULT_FORMAT: yaml
          ANSIBLE_HOST_KEY_CHECKING: false
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -o pipefail
          pipx run --spec ansible ansible-playbook playbooks/playbook_k3s_datastore_migrate.yaml \
            -i inventory/etcd_hosts \
            -u root \
            --private-key=/tmp/mike_ssh_key \
            -e "k3s_migrate_mode=${MODE}" \
            -e "k3s_migrate_confirm=${CONFIRM}" \
            -e "k3s_migrate_summary_file=${RUNNER_TEMP}/k3s_summary.md" \
            --extra-vars "ansible_ssh_pass=${ANSIBLE_SSH_PASS} ansible_ssh_common_args='-o StrictHostKeyChecking=no'" \
            | tee "$RUNNER_TEMP/k3s.log"

      # The playbook writes its own summary when it gets to the end; after a
      # failure, the end of the (already public) log says where it stopped.
      - name: Job summary
        if: always() && steps.playbook.outcome != 'skipped'
        env:
          MODE: ${{ inputs.mode }}
          OUTCOME: ${{ steps.playbook.outcome }}
        run: |
          {
            if [ -s "$RUNNER_TEMP/k3s_summary.md" ]; then
              cat "$RUNNER_TEMP/k3s_summary.md"
            else
              echo "### k3s datastore: $MODE"
            fi
            echo
            if [ "$OUTCOME" = "success" ]; then
              echo "**Result: success.**"
            else
              echo "**Result: FAILED.** Where it stopped:"
              echo '```'
              grep -E '^(TASK|fatal|failed|FAILED|ERROR|\[ERROR\])|"msg"|msg:' "$RUNNER_TEMP/k3s.log" | tail -n 40 || true
              echo '```'
            fi
            echo '```'
            sed -n '/^PLAY RECAP/,$p' "$RUNNER_TEMP/k3s.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup Temporary Files
        if: always()
        run: |
          rm -f /tmp/mike_ssh_key "$RUNNER_TEMP/k3s.log" "$RUNNER_TEMP/k3s_summary.md"
