name: Export workflow logs to OTel

# Reusable workflow: ships the logs of one finished workflow run to
# https://otel.mfaherty.net/v1/logs as OTLP/HTTP JSON, one log record per log
# line. Called by a small otel-export.yml in each repo, triggered by
# workflow_run, so it always runs in the caller's repo with the caller's
# GITHUB_TOKEN and reads the finished run from the caller's event payload.
#
# Path in (same as Cloudflare Workers logs):
#   this job -> otel.mfaherty.net (Cloudflare Access, service token only)
#     -> cloudflared tunnel -> redpanda-connect-otel (gh_hdc,
#        kubernetes/apps/redpanda-connect-otel.yaml) -> Redpanda
#     -> redpanda-connect-es -> ES index ks-logstash-log-github-actions
#
# Why a hand-rolled exporter: redpanda-connect-otel only understands OTLP
# JSON, and the off-the-shelf GitHub Actions OTel exporters send protobuf
# and/or traces only.
#
# Each job's log becomes its own resourceLogs with OTel CI/CD semantic
# convention attributes (cicd.pipeline.*, vcs.*). Lines are attributed to a
# step by timestamp; GitHub only reports step boundaries to the second, so a
# line logged in the same second as a step change can land on either step.
# GitHub masks secrets in job logs before we ever see them.
#
# This file lives in a public repo so private repos can call it.

on:
  workflow_call:
    secrets:
      OTEL_CF_ACCESS_CLIENT_ID:
        description: Cloudflare Access service token client ID for otel.mfaherty.net
        required: true
      OTEL_CF_ACCESS_CLIENT_SECRET:
        description: Cloudflare Access service token client secret for otel.mfaherty.net
        required: true

permissions:
  actions: read

jobs:
  export:
    name: Export logs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Export run logs to otel.mfaherty.net
        env:
          GH_TOKEN: ${{ github.token }}
          OTEL_ENDPOINT: https://otel.mfaherty.net/v1/logs
          CF_ACCESS_CLIENT_ID: ${{ secrets.OTEL_CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.OTEL_CF_ACCESS_CLIENT_SECRET }}
        shell: python3 {0}
        run: |
          import calendar, gzip, json, os, re, sys, time
          from datetime import datetime
          import urllib.error, urllib.request

          API = os.environ["GITHUB_API_URL"]
          ENDPOINT = os.environ["OTEL_ENDPOINT"]
          BATCH = 1000          # log records per OTLP request
          MAX_LINE = 32 * 1024  # longer lines are truncated

          with open(os.environ["GITHUB_EVENT_PATH"]) as f:
              event = json.load(f)
          run = event.get("workflow_run")
          if not run:
              sys.exit("not triggered by workflow_run; nothing to export")
          repo = run["repository"]["full_name"]


          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None


          opener = urllib.request.build_opener(NoRedirect)


          def gh(path):
              req = urllib.request.Request(API + path, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              })
              try:
                  with opener.open(req, timeout=60) as r:
                      return r.read()
              except urllib.error.HTTPError as e:
                  # Job logs answer 302 to a signed blob URL, which rejects
                  # requests that still carry our Authorization header.
                  if e.code in (301, 302, 307, 308):
                      with urllib.request.urlopen(e.headers["Location"], timeout=120) as r:
                          return r.read()
                  raise


          def jobs():
              page = 1
              while True:
                  data = json.loads(gh(f"/repos/{repo}/actions/runs/{run['id']}"
                                       f"/attempts/{run['run_attempt']}/jobs?per_page=100&page={page}"))
                  yield from data["jobs"]
                  if page * 100 >= data["total_count"]:
                      return
                  page += 1


          def attr(key, value):
              if isinstance(value, bool):
                  v = {"boolValue": value}
              elif isinstance(value, int):
                  v = {"intValue": str(value)}
              else:
                  v = {"stringValue": str(value)}
              return {"key": key, "value": v}


          def attrs(d):
              return [attr(k, v) for k, v in d.items() if v is not None and v != ""]


          def iso_ns(s):
              # Step times come as 2026-01-01T00:00:00Z or with an offset.
              return int(datetime.fromisoformat(s).timestamp() * 10**9)


          LINE = re.compile(r"^(\d{4}-\d\d-\d\dT\d\d:\d\d:\d\d)(?:\.(\d+))?Z (.*)$")
          MARKER = re.compile(r"^##\[(error|warning|notice|debug)\]")
          SEVERITY = {  # text, OTel severityNumber
              "error": ("ERROR", 17), "warning": ("WARN", 13),
              "notice": ("INFO", 9), "debug": ("DEBUG", 5), None: ("INFO", 9),
          }


          def records(job, text):
              steps = sorted(((iso_ns(s["started_at"]), s) for s in job.get("steps") or []
                              if s.get("started_at")), key=lambda t: t[0])
              last_ns = 0
              for raw in text.lstrip("\ufeff").splitlines():
                  m = LINE.match(raw)
                  if m:
                      secs = calendar.timegm(time.strptime(m.group(1), "%Y-%m-%dT%H:%M:%S"))
                      ns = secs * 10**9 + int((m.group(2) or "0")[:9].ljust(9, "0"))
                      line = m.group(3)
                      last_ns = ns
                  else:
                      ns, line = last_ns, raw
                  mk = MARKER.match(line)
                  level = mk.group(1) if mk else None
                  if mk:
                      line = line[mk.end():]
                  sev_text, sev_num = SEVERITY[level]
                  step = None
                  for started, s in steps:
                      if started <= ns:
                          step = s
                  yield {
                      "timeUnixNano": str(ns),
                      "observedTimeUnixNano": str(time.time_ns()),
                      "severityText": sev_text,
                      "severityNumber": sev_num,
                      "body": {"stringValue": line[:MAX_LINE]},
                      "attributes": attrs({
                          "cicd.pipeline.task.step.name": step and step["name"],
                          "cicd.pipeline.task.step.number": step and step["number"],
                      }),
                  }


          def post(resource, recs):
              body = gzip.compress(json.dumps({"resourceLogs": [{
                  "resource": {"attributes": resource},
                  "scopeLogs": [{"scope": {"name": "github-actions-log-export"}, "logRecords": recs}],
              }]}).encode())
              req = urllib.request.Request(ENDPOINT, data=body, method="POST", headers={
                  "Content-Type": "application/json",
                  "Content-Encoding": "gzip",
                  "CF-Access-Client-Id": os.environ["CF_ACCESS_CLIENT_ID"],
                  "CF-Access-Client-Secret": os.environ["CF_ACCESS_CLIENT_SECRET"],
              })
              for attempt in range(5):
                  try:
                      with opener.open(req, timeout=60) as r:
                          r.read()
                          return
                  except urllib.error.HTTPError as e:
                      # A redirect here is Access bouncing us to its login page:
                      # the service token is missing or not allowed by the policy.
                      if e.code < 500 and e.code != 429:
                          sys.exit(f"otel endpoint rejected batch: HTTP {e.code} {e.reason}")
                      err = f"HTTP {e.code}"
                  except OSError as e:
                      err = str(e)
                  print(f"::warning::otel export attempt {attempt + 1} failed ({err}), retrying")
                  time.sleep(2 ** attempt)
              sys.exit(f"otel endpoint unavailable after retries: {err}")


          run_resource = {
              "service.name": repo,
              "service.namespace": "github-actions",
              "cicd.pipeline.name": run["name"],
              "cicd.pipeline.run.id": run["id"],
              "cicd.pipeline.run.url.full": run["html_url"],
              "cicd.pipeline.result": run.get("conclusion"),
              "vcs.repository.name": repo,
              "vcs.repository.url.full": run["repository"]["html_url"],
              "vcs.ref.head.name": run.get("head_branch"),
              "vcs.ref.head.revision": run.get("head_sha"),
              "github.workflow.path": run.get("path"),
              "github.run.number": run.get("run_number"),
              "github.run.attempt": run.get("run_attempt"),
              "github.event.name": run.get("event"),
              "github.actor": (run.get("triggering_actor") or run.get("actor") or {}).get("login"),
          }

          total = 0
          for job in jobs():
              if job.get("conclusion") == "skipped" or not job.get("steps"):
                  continue
              try:
                  text = gh(f"/repos/{repo}/actions/jobs/{job['id']}/logs").decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  print(f"::warning::no logs for job '{job['name']}' ({job['id']}): HTTP {e.code}")
                  continue
              resource = attrs(run_resource | {
                  "cicd.pipeline.task.name": job["name"],
                  "cicd.pipeline.task.run.id": job["id"],
                  "cicd.pipeline.task.run.url.full": job.get("html_url"),
                  "cicd.pipeline.task.run.result": job.get("conclusion"),
                  "cicd.worker.name": job.get("runner_name"),
              })
              recs = list(records(job, text))
              for i in range(0, len(recs), BATCH):
                  post(resource, recs[i:i + BATCH])
              total += len(recs)
              print(f"{job['name']}: {len(recs)} lines")

          print(f"exported {total} log lines from {run['name']} #{run['run_number']} ({run['html_url']})")
