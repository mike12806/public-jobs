name: etcd restore

# Runs gh_hdc's ansible/playbooks/playbook_etcd_restore.yaml against the etcd
# cluster that is the k3s datastore. See the playbook header.
#
#   test    (default) restore a backup into scratch space on one member and
#           start a throwaway etcd from it; no downtime, changes nothing.
#   member  confirm REBUILD: one bad member's data is moved aside, then
#           gh_hdc's playbook_etcd_cluster.yaml joins it afresh. Refused unless
#           it's unhealthy and the others hold quorum.
#   full    confirm RESTORE: DOWNTIME. Every member restored from the backup
#           (newest, or "snapshot"); k3s stopped and started around it.
#
# Runs on a GitHub-hosted runner through Tailscale (tailscale-lxc), so it
# works with Kubernetes down. The members already hold the B2 credentials
# and restic password; the Proxmox tokens and backup credentials here are
# for the etcd cluster playbook that a member rebuild runs afterwards.
# This repo is public, so its logs are too: only ids, times and counts.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'test (no downtime), member (rebuild one member), full (restore the whole cluster: DOWNTIME)'
        type: choice
        options: [test, member, full]
        default: test
      member:
        description: 'member mode: which member (etcd-1 .. etcd-5)'
        type: string
        default: ''
      snapshot:
        description: 'test/full: restic snapshot id, or latest'
        type: string
        default: latest
      confirm:
        description: 'Type REBUILD for member, RESTORE for full; leave empty for test'
        type: string
        default: ''
      skip_k3s:
        description: 'full: the k3s servers are down or unreachable; do not stop/start them'
        type: boolean
        default: false
      gh_hdc_ref:
        description: 'gh_hdc branch/ref to run the playbooks from'
        type: string
        default: main

concurrency:
  group: etcd_cluster  # never alongside the etcd cluster workflow
  cancel-in-progress: false

permissions:
  id-token: write  # log in to Vault through GitHub OIDC
  contents: read

jobs:
  etcd-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check the confirmation
        env:
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
          MEMBER: ${{ inputs.member }}
        run: |
          case "$MODE" in
            test) [ -z "$CONFIRM" ] || echo "::notice::confirm is ignored for test" ;;
            member)
              [ "$CONFIRM" = "REBUILD" ] || { echo "::error::member needs confirm = REBUILD"; exit 1; }
              [[ "$MEMBER" =~ ^etcd-[0-9]+$ ]] || { echo "::error::member needs member = etcd-N"; exit 1; } ;;
            full) [ "$CONFIRM" = "RESTORE" ] || { echo "::error::full needs confirm = RESTORE"; exit 1; } ;;
          esac
          echo "::notice::Mode: $MODE"

      - name: Prefer IPv4 over IPv6
        run: |
          # Force IPv4 preference to avoid Tailscale IPv6 connectivity issues
          echo 'precedence ::ffff:0:0/96 100' | sudo tee -a /etc/gai.conf

      - name: Connect to Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd  # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: github-runner-etcd-restore
          version: latest

      # vault.mfaherty.net is only in the LAN's DNS (Pi-hole), which partly
      # runs on Kubernetes. The GSLB VIP's HAProxy passes TLS through to Vault,
      # so the certificate is still checked against the name.
      - name: Pin vault.mfaherty.net to the GSLB VIP
        run: echo '192.168.1.113 vault.mfaherty.net' | sudo tee -a /etc/hosts

      # Secrets come from Vault (kv/ci/*), logged in through GitHub OIDC with
      # the role below (gh_hdc vault/), so they're no longer GitHub secrets.
      - name: Read secrets from Vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc  # v4.0.0
        with:
          url: https://vault.mfaherty.net
          method: jwt
          path: github-actions
          role: public-jobs
          jwtGithubAudience: https://vault.mfaherty.net
          secrets: |
            kv/data/ci/github GH_HDC_PAT | GH_HDC_PAT ;
            kv/data/ci/etcd-backup ACCESS_KEY_ID | ETCD_BACKUP_ACCESS_KEY_ID ;
            kv/data/ci/etcd-backup SECRET_ACCESS_KEY | ETCD_BACKUP_SECRET_ACCESS_KEY ;
            kv/data/ci/etcd-backup BUCKET | ETCD_BACKUP_BUCKET ;
            kv/data/ci/etcd-backup ENDPOINT | ETCD_BACKUP_ENDPOINT ;
            kv/data/ci/etcd-backup RESTIC_PASSWORD | ETCD_BACKUP_RESTIC_PASSWORD ;
            kv/data/ci/proxmox PVE2_SECRET | PVE2_SECRET ;
            kv/data/ci/proxmox PVE2_TOKEN_ID | PVE2_TOKEN_ID ;
            kv/data/ci/proxmox PVE3_SECRET | PVE3_SECRET ;
            kv/data/ci/proxmox PVE3_TOKEN_ID | PVE3_TOKEN_ID ;
            kv/data/ci/proxmox PVE4_SECRET | PVE4_SECRET ;
            kv/data/ci/proxmox PVE4_TOKEN_ID | PVE4_TOKEN_ID ;
            kv/data/ci/proxmox PVE5_SECRET | PVE5_SECRET ;
            kv/data/ci/proxmox PVE5_TOKEN_ID | PVE5_TOKEN_ID ;
            kv/data/ci/proxmox PVE6_SECRET | PVE6_SECRET ;
            kv/data/ci/proxmox PVE6_TOKEN_ID | PVE6_TOKEN_ID ;
            kv/data/ci/proxmox PVE7_SECRET | PVE7_SECRET ;
            kv/data/ci/proxmox PVE7_TOKEN_ID | PVE7_TOKEN_ID ;
            kv/data/ci/proxmox PVE_SECRET | PVE_SECRET ;
            kv/data/ci/proxmox PVE_TOKEN_ID | PVE_TOKEN_ID ;
            kv/data/ci/smtp EMAIL_FROM | EMAIL_FROM ;
            kv/data/ci/smtp EMAIL_TO | EMAIL_TO ;
            kv/data/ci/smtp SMTP_PASSWORD | SMTP_PASSWORD ;
            kv/data/ci/smtp SMTP_PORT | SMTP_PORT ;
            kv/data/ci/smtp SMTP_SERVER | SMTP_SERVER ;
            kv/data/ci/smtp SMTP_USERNAME | SMTP_USERNAME ;
            kv/data/ci/ssh ANSIBLE_SSH_PASSWORD_1 | ANSIBLE_SSH_PASSWORD_1 ;
            kv/data/ci/ssh MIKEYSSHKEYLINODE | MIKEYSSHKEYLINODE

      - name: Checkout gh_hdc
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: mike12806/gh_hdc
          ref: ${{ inputs.gh_hdc_ref || 'main' }}
          token: ${{ env.GH_HDC_PAT }}
          path: gh_hdc

      - name: Cache pipx and ansible
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.local/bin
            ~/.local/pipx
          key: ${{ runner.os }}-pipx-ansible-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pipx-ansible-

      # iputils-ping: the playbook pings a new member's address before
      # creating it, to catch a device still holding that lease.
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y python3-pip python3 python3-venv pipx sshpass openssh-client iputils-ping
          pipx ensurepath
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      # New containers get this key's public half as root's authorized key.
      - name: Write SSH Private Key to File
        env:
          SSH_KEY: ${{ env.MIKEYSSHKEYLINODE }}
        run: |
          printf '%s\n' "$SSH_KEY" | sed 's/\\n/\n/g' > /tmp/mike_ssh_key
          chmod 600 /tmp/mike_ssh_key

      - name: Restore playbook
        id: playbook
        working-directory: gh_hdc/ansible
        env:
          ANSIBLE_SSH_PASS: ${{ env.ANSIBLE_SSH_PASSWORD_1 }}
          ANSIBLE_PRIVATE_KEY_FILE: /tmp/mike_ssh_key
          ANSIBLE_PYTHON_INTERPRETER: /usr/bin/python3
          ANSIBLE_GATHERING: smart
          ANSIBLE_TIMEOUT: 30
          ANSIBLE_STDOUT_CALLBACK: ansible.builtin.default
          ANSIBLE_CALLBACK_RESULT_FORMAT: yaml
          ANSIBLE_HOST_KEY_CHECKING: false
          # Same per-host Proxmox API tokens as vault_cluster.yml. Endpoints
          # come from the playbook (the hosts' IPs).
          PVE_HOST_COUNT: "7"
          PVE_TOKEN_ID: ${{ env.PVE_TOKEN_ID }}
          PVE_SECRET: ${{ env.PVE_SECRET }}
          PVE2_TOKEN_ID: ${{ env.PVE2_TOKEN_ID }}
          PVE2_SECRET: ${{ env.PVE2_SECRET }}
          PVE3_TOKEN_ID: ${{ env.PVE3_TOKEN_ID }}
          PVE3_SECRET: ${{ env.PVE3_SECRET }}
          PVE4_TOKEN_ID: ${{ env.PVE4_TOKEN_ID }}
          PVE4_SECRET: ${{ env.PVE4_SECRET }}
          PVE5_TOKEN_ID: ${{ env.PVE5_TOKEN_ID }}
          PVE5_SECRET: ${{ env.PVE5_SECRET }}
          PVE6_TOKEN_ID: ${{ env.PVE6_TOKEN_ID }}
          PVE6_SECRET: ${{ env.PVE6_SECRET }}
          PVE7_TOKEN_ID: ${{ env.PVE7_TOKEN_ID }}
          PVE7_SECRET: ${{ env.PVE7_SECRET }}
          MODE: ${{ inputs.mode }}
          CONFIRM: ${{ inputs.confirm }}
          MEMBER: ${{ inputs.member }}
          SNAPSHOT: ${{ inputs.snapshot }}
          SKIP_K3S: ${{ inputs.skip_k3s }}
        run: |
          set -o pipefail
          pipx run --spec ansible ansible-playbook playbooks/playbook_etcd_restore.yaml \
            -i inventory/etcd_hosts \
            -u root \
            --private-key=/tmp/mike_ssh_key \
            -e "etcd_restore_mode=${MODE}" \
            -e "etcd_restore_confirm=${CONFIRM}" \
            -e "etcd_restore_member=${MEMBER}" \
            -e "etcd_restore_snapshot=${SNAPSHOT:-latest}" \
            -e "etcd_restore_skip_k3s=${SKIP_K3S}" \
            --extra-vars "ansible_ssh_pass=${ANSIBLE_SSH_PASS} ansible_ssh_common_args='-o StrictHostKeyChecking=no'" \
            | tee "$RUNNER_TEMP/restore.log"

      # A rebuilt member has no data; the cluster playbook's join play adds it.
      - name: Rejoin the member (etcd cluster playbook)
        if: inputs.mode == 'member'
        working-directory: gh_hdc/ansible
        env:
          ANSIBLE_SSH_PASS: ${{ env.ANSIBLE_SSH_PASSWORD_1 }}
          ANSIBLE_PRIVATE_KEY_FILE: /tmp/mike_ssh_key
          ANSIBLE_PYTHON_INTERPRETER: /usr/bin/python3
          ANSIBLE_GATHERING: smart
          ANSIBLE_TIMEOUT: 30
          ANSIBLE_STDOUT_CALLBACK: ansible.builtin.default
          ANSIBLE_CALLBACK_RESULT_FORMAT: yaml
          ANSIBLE_HOST_KEY_CHECKING: false
          # Same per-host Proxmox API tokens as vault_cluster.yml. Endpoints
          # come from the playbook (the hosts' IPs).
          PVE_HOST_COUNT: "7"
          PVE_TOKEN_ID: ${{ env.PVE_TOKEN_ID }}
          PVE_SECRET: ${{ env.PVE_SECRET }}
          PVE2_TOKEN_ID: ${{ env.PVE2_TOKEN_ID }}
          PVE2_SECRET: ${{ env.PVE2_SECRET }}
          PVE3_TOKEN_ID: ${{ env.PVE3_TOKEN_ID }}
          PVE3_SECRET: ${{ env.PVE3_SECRET }}
          PVE4_TOKEN_ID: ${{ env.PVE4_TOKEN_ID }}
          PVE4_SECRET: ${{ env.PVE4_SECRET }}
          PVE5_TOKEN_ID: ${{ env.PVE5_TOKEN_ID }}
          PVE5_SECRET: ${{ env.PVE5_SECRET }}
          PVE6_TOKEN_ID: ${{ env.PVE6_TOKEN_ID }}
          PVE6_SECRET: ${{ env.PVE6_SECRET }}
          PVE7_TOKEN_ID: ${{ env.PVE7_TOKEN_ID }}
          PVE7_SECRET: ${{ env.PVE7_SECRET }}
        run: |
          set -o pipefail
          pipx run --spec ansible ansible-playbook playbooks/playbook_etcd_cluster.yaml \
            -i inventory/etcd_hosts \
            -u root \
            --private-key=/tmp/mike_ssh_key \
            --extra-vars "ansible_ssh_pass=${ANSIBLE_SSH_PASS} ansible_ssh_common_args='-o StrictHostKeyChecking=no'" \
            | tee -a "$RUNNER_TEMP/restore.log"

      - name: Job summary
        if: always()
        run: |
          {
            echo "### etcd restore: ${{ inputs.mode }}"
            echo '```'
            grep -E '^ +msg:|^ +success_msg' -A2 "$RUNNER_TEMP/restore.log" | grep -vE '^--$' | tail -n 40 || true
            sed -n '/^PLAY RECAP/,$p' "$RUNNER_TEMP/restore.log" | tail -n 12 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup Temporary Files
        if: always()
        run: |
          rm -f /tmp/mike_ssh_key "$RUNNER_TEMP/restore.log"
