name: Check etcd Backups in B2

on:
  schedule:
    - cron: '37 */2 * * *'  # Every 2 hours at minute 37 (backups land hourly at ~:07)
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: etcd-backup-checker
  cancel-in-progress: true

permissions:
  id-token: write  # log in to Vault through GitHub OIDC
  contents: read

env:
  RESTIC_REPO_PATH: etcd-k3s
  MAX_AGE_HOURS: 3

jobs:
  check-etcd-backups:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Prefer IPv4 over IPv6
        run: |
          # Force IPv4 preference to avoid Tailscale IPv6 connectivity issues
          echo 'precedence ::ffff:0:0/96 100' | sudo tee -a /etc/gai.conf

      - name: Connect to Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd  # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: github-runner-etcd-backup-checker
          version: latest

      # vault.mfaherty.net is only in the LAN's DNS (Pi-hole), which partly
      # runs on Kubernetes. The GSLB VIP's HAProxy passes TLS through to Vault,
      # so the certificate is still checked against the name.
      - name: Pin vault.mfaherty.net to the GSLB VIP
        run: echo '192.168.1.113 vault.mfaherty.net' | sudo tee -a /etc/hosts

      # Secrets come from Vault (kv/ci/*), logged in through GitHub OIDC with
      # the role below (gh_hdc vault/), so they're not GitHub secrets.
      - name: Read secrets from Vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc  # v4.0.0
        with:
          url: https://vault.mfaherty.net
          method: jwt
          path: github-actions
          role: public-jobs
          jwtGithubAudience: https://vault.mfaherty.net
          secrets: |
            kv/data/ci/etcd-backup ACCESS_KEY_ID | AWS_ACCESS_KEY_ID ;
            kv/data/ci/etcd-backup SECRET_ACCESS_KEY | AWS_SECRET_ACCESS_KEY ;
            kv/data/ci/etcd-backup BUCKET | ETCD_BACKUP_BUCKET ;
            kv/data/ci/etcd-backup ENDPOINT | ETCD_BACKUP_ENDPOINT ;
            kv/data/ci/etcd-backup RESTIC_PASSWORD | RESTIC_PASSWORD ;
            kv/data/ci/smtp EMAIL_FROM | EMAIL_FROM ;
            kv/data/ci/smtp EMAIL_TO | EMAIL_TO ;
            kv/data/ci/smtp SMTP_PASSWORD | SMTP_PASSWORD ;
            kv/data/ci/smtp SMTP_PORT | SMTP_PORT ;
            kv/data/ci/smtp SMTP_SERVER | SMTP_SERVER ;
            kv/data/ci/smtp SMTP_USERNAME | SMTP_USERNAME

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq restic
          echo "RESTIC_REPOSITORY=s3:https://${ETCD_BACKUP_ENDPOINT}/${ETCD_BACKUP_BUCKET}/${RESTIC_REPO_PATH}" >> "$GITHUB_ENV"

      - name: Check latest etcd snapshot
        id: check_etcd
        run: |
          set -euo pipefail

          echo "🔍 Listing snapshots in restic repo..."
          if ! SNAPSHOTS=$(restic snapshots --json --no-lock 2>restic_err.log); then
            echo "error=Unable to open restic repo: $(tail -n 3 restic_err.log | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
            cat restic_err.log
            exit 1
          fi

          COUNT=$(echo "$SNAPSHOTS" | jq 'length')
          if [ "$COUNT" -eq 0 ]; then
            echo "error=No snapshots found in restic repo" >> "$GITHUB_OUTPUT"
            echo "❌ No snapshots found"
            exit 1
          fi

          LATEST=$(echo "$SNAPSHOTS" | jq -r 'sort_by(.time) | last')
          LATEST_TIME=$(echo "$LATEST" | jq -r '.time')
          LATEST_ID=$(echo "$LATEST" | jq -r '.short_id')
          LATEST_HOST=$(echo "$LATEST" | jq -r '.hostname')
          AGE_HOURS=$(( ($(date +%s) - $(date -d "$LATEST_TIME" +%s)) / 3600 ))

          echo "  Total snapshots:   $COUNT"
          echo "  Latest snapshot:   $LATEST_ID from $LATEST_HOST at $LATEST_TIME (${AGE_HOURS}h old)"

          if [ "$AGE_HOURS" -ge "$MAX_AGE_HOURS" ]; then
            echo "error=Latest etcd snapshot $LATEST_ID is ${AGE_HOURS}h old (threshold: ${MAX_AGE_HOURS}h). Last snapshot at $LATEST_TIME from $LATEST_HOST." >> "$GITHUB_OUTPUT"
            echo "❌ Latest snapshot is too old"
            exit 1
          fi
          echo "✅ Latest snapshot is recent"

      - name: Verify restic repo integrity
        id: check_repo
        run: |
          set -euo pipefail
          if ! restic check --no-lock 2>&1 | tee restic_check.log; then
            echo "error=restic check failed: $(tail -n 5 restic_check.log | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "✅ Repo integrity check passed"

      - name: Send email on failure
        # Needs the SMTP settings from Vault, so a failure to read Vault
        # itself only shows up as GitHub's own failed-run notification.
        if: failure() && env.SMTP_SERVER != ''
        uses: dawidd6/action-send-mail@67ce3558d613188179559c61d3565140cf389968  # v22
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: ${{ env.SMTP_PORT }}
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: "❌ etcd Backup Check Failed"
          body: |
            etcd backup check failed for B2 restic repo (${{ env.RESTIC_REPO_PATH }}).

            ${{ steps.check_etcd.outputs.error }}${{ steps.check_repo.outputs.error }}

            If no error is shown above, an earlier step failed (Tailscale, Vault, or dependency install).

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          to: ${{ env.EMAIL_TO }}
          from: ${{ env.EMAIL_FROM }}

      - name: Cleanup
        if: always()
        run: rm -rf restic_err.log restic_check.log ~/.cache/restic
