name: Sync Vault Secret to Kubernetes

permissions:
  contents: read

concurrency:
  group: sync-vault-secret
  cancel-in-progress: true

on:
  schedule:
    - cron: '*/10 * * * *'  # Run every 10 minutes
  workflow_dispatch:

jobs:
  sync-secret:
    runs-on: ubuntu-24.04
    # Room for the API probe (up to 3m) plus a retried apply batch (up to ~70s
    # of backoff), while still finishing inside the 10-minute schedule.
    timeout-minutes: 9

    env:
      VAULT_ADDR: https://vault.mfaherty.net
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}

    steps:
      - name: Checkout gh_hdc
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: mike12806/gh_hdc
          token: ${{ secrets.GH_HDC_PAT }}
          path: gh_hdc

      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888  # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: github-runner-vault-sync
          version: latest

      - name: Setup kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d  # v5.1.0
        with:
          version: 'latest'

      - name: Set up kubeconfig
        run: |
          mkdir -p $HOME/.kube
          base64 -d > $HOME/.kube/config << 'EOF'
          ${{ secrets.KUBECONFIG }}
          EOF
          chmod 600 $HOME/.kube/config
          
          # Verify kubeconfig is valid YAML (suppress output to avoid leaking secrets)
          if ! python3 -c "import yaml; yaml.safe_load(open('$HOME/.kube/config'))" 2>/dev/null; then
            echo "ERROR: kubeconfig is not valid YAML"
            exit 1
          fi

      - name: Wait for the API server to accept our credentials
        run: |
          set -euo pipefail
          export KUBECONFIG=$HOME/.kube/config

          # 2026-09-12 21:49-22:03 UTC: every kubectl client in this repo got 401
          # ("the server has asked for the client to provide credentials") from the
          # API server for ~15 minutes, with an unchanged kubeconfig. kubectl's own
          # discovery retry covers about a second, so this job failed on the first
          # manifest of the apply step and reported the outage as a manifest problem:
          #   error validating "cloudflare-cache-purge.yaml": error validating data:
          #   failed to download openapi: the server has asked for the client to
          #   provide credentials
          # Nothing was wrong with that manifest, and --validate=false would only have
          # moved the same 401 to the write itself. So probe the API here instead:
          # a blip shorter than the window below is ridden out, a longer one fails
          # with the real reason, and no Vault data is written to the runner when the
          # cluster cannot be reached anyway.
          deadline=$((SECONDS + 180))
          delay=5

          until err=$(kubectl cluster-info 2>&1 >/dev/null); do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::API server still rejecting or refusing kubectl after ${SECONDS}s"
              printf '%s\n' "$err"
              exit 1
            fi
            echo "API server not usable yet, retrying in ${delay}s:"
            printf '%s\n' "$err"
            sleep "$delay"
            delay=$(( delay < 30 ? delay * 2 : 30 ))
          done

          echo "API server reachable and credentials accepted"

      - name: Fetch Secret YAML from Vault (no log output)
        id: fetch_secret
        run: |
          set -euo pipefail
          export KUBECONFIG=$HOME/.kube/config
          
          # Fetch all data from Vault kubernetes/secret path
          vault_response=$(curl -sSL \
            --header "X-Vault-Token: $VAULT_TOKEN" \
            --header "Content-Type: application/json" \
            "$VAULT_ADDR/v1/kv/data/kubernetes/secret")
          
          # Extract all key-value pairs from the data object
          echo "$vault_response" | jq -r '.data.data' > vault_data.json
          
          # Validate that we got valid content
          if [ ! -s vault_data.json ]; then
            echo "No data received from Vault"
            exit 1
          fi
          
          # Process each key-value pair and create YAML files
          echo "$vault_response" | jq -r '.data.data | keys[]' | while read -r key; do
            echo "Processing key: $key"
            echo "$vault_response" | jq -r ".data.data[\"$key\"]" > "${key}.yaml"
          done

      - name: Apply Secrets to Cluster
        env:
          # kubectl failures that mean the control plane is having a moment rather
          # than that a manifest is wrong. Anything outside this list fails the run
          # on the first attempt, so a bad secret from Vault is not retried for
          # minutes before it is reported.
          TRANSIENT_ERRORS: 'asked for the client to provide credentials|You must be logged in to the server|failed to download openapi|Unable to connect to the server|connection refused|i/o timeout|TLS handshake timeout|unexpected EOF|currently unable to handle the request|etcdserver: request timed out|too many requests'
        run: |
          set -euo pipefail
          export KUBECONFIG=$HOME/.kube/config

          shopt -s nullglob
          manifests=( *.yaml )
          shopt -u nullglob

          if [ "${#manifests[@]}" -eq 0 ]; then
            echo "::error::Vault returned data but produced no YAML files to apply"
            exit 1
          fi

          apply_all() {
            local yaml_file
            for yaml_file in "${manifests[@]}"; do
              echo "Applying $yaml_file to cluster"
              # Stop at the first failure so a mid-batch outage is retried from
              # the top rather than leaving the remaining secrets unapplied.
              kubectl apply -f "$yaml_file" || return 1
            done
          }

          # Applying these Secrets is idempotent, so the batch is retried whole;
          # re-applying the files that already landed is a no-op.
          attempt=1
          max_attempts=4
          delay=10

          while true; do
            if output=$(apply_all 2>&1); then
              printf '%s\n' "$output"
              break
            fi
            printf '%s\n' "$output"

            if ! printf '%s' "$output" | grep -Eq "$TRANSIENT_ERRORS"; then
              echo "::error::kubectl apply failed with a non-transient error"
              exit 1
            fi

            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::kubectl apply still hitting transient API errors after ${attempt} attempts"
              exit 1
            fi

            attempt=$((attempt + 1))
            echo "Transient API error, retrying the whole batch in ${delay}s (attempt ${attempt}/${max_attempts})"
            sleep "$delay"
            delay=$((delay * 2))
          done

      - name: Cleanup
        if: always()
        run: |
          rm -f *.yaml
          rm -f vault_data.json
          rm -f $HOME/.kube/config
          rm -rf $HOME/.kube
