name: renovate-config-validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate:
    name: validate-renovate-config
    runs-on: self-hosted
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Validate Renovate config
        env:
          # renovate: datasource=npm depName=renovate
          RENOVATE_VERSION: 44.190.0
        run: |
          # Find all potential Renovate config files
          config_files=$(find . -type f \( \
            -name "renovate.json" -o \
            -name "renovate.json5" -o \
            -name ".renovaterc.json" -o \
            -name ".renovaterc" \
          \))

          # Validate each config file
          for config in $config_files; do
            echo "Validating $config..."
            npx --yes -p "renovate@${RENOVATE_VERSION}" renovate-config-validator "$config"
            if [ $? -ne 0 ]; then
              echo "Error: Invalid Renovate configuration in $config"
              exit 1
            fi
          done
