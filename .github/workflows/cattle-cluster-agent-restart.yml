name: Restart Cattle Cluster Agent Daily

on:
  schedule:
    - cron: '0 5 * * *'  # Run daily at 5:00 AM UTC
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: cattle-cluster-agent-restart
  cancel-in-progress: true

permissions:
  id-token: write  # log in to Vault through GitHub OIDC
  contents: read

jobs:
  restart-cattle-agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd  # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: github-runner-cattle-agent-restart
          version: latest

      # Secrets come from Vault (kv/ci/*), logged in through GitHub OIDC with
      # the role below (gh_hdc vault/), so they're no longer GitHub secrets.
      - name: Read secrets from Vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc  # v4.0.0
        with:
          url: https://vault.mfaherty.net
          method: jwt
          path: github-actions
          role: public-jobs
          jwtGithubAudience: https://vault.mfaherty.net
          secrets: |
            kv/data/ci/github GH_HDC_PAT | GH_HDC_PAT ;
            kv/data/ci/kubernetes KUBECONFIG | KUBECONFIG_B64

      - name: Checkout gh_hdc
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: mike12806/gh_hdc
          token: ${{ env.GH_HDC_PAT }}
          path: gh_hdc

      - name: Setup kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e  # v5.2.0
        with:
          version: 'latest'
      
      - name: Set up kubeconfig
        run: |
          mkdir -p $HOME/.kube
          base64 -d > $HOME/.kube/config << 'EOF'
          ${{ env.KUBECONFIG_B64 }}
          EOF
          chmod 600 $HOME/.kube/config

      - name: Restart cattle-cluster-agent deployment
        run: |
          echo "🔄 Restarting cattle-cluster-agent deployment..."
          kubectl rollout restart deployment cattle-cluster-agent -n cattle-system
          
          echo "⏳ Waiting for rollout to complete..."
          if kubectl rollout status deployment cattle-cluster-agent -n cattle-system --timeout=5m; then
            echo "✅ cattle-cluster-agent deployment restarted successfully"
          else
            echo "❌ Failed to restart cattle-cluster-agent deployment"
            exit 1
          fi

      - name: Verify deployment status
        run: |
          echo "📊 Checking deployment status..."
          kubectl get deployment cattle-cluster-agent -n cattle-system
          echo ""
          echo "Pod status in cattle-system namespace:"
          kubectl get pods -n cattle-system
