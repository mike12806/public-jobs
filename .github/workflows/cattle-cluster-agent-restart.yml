name: Restart Cattle Cluster Agent Daily

on:
  schedule:
    - cron: '0 5 * * *'  # Run daily at 5:00 AM UTC
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: cattle-cluster-agent-restart
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  restart-cattle-agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout gh_hdc
        uses: actions/checkout@1d96c772d19495a3b5c8dda2ff7a2fb3ba3dbf24  # v6.1.0
        with:
          repository: mike12806/gh_hdc
          token: ${{ secrets.GH_HDC_PAT }}
          path: gh_hdc

      - name: Connect to Tailscale
        uses: tailscale/github-action@51ca60e9cd01b00e9c2ee780705f97d4d3b8c4d5  # v4.0.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: github-runner-cattle-agent-restart
          version: latest

      - name: Setup kubectl
        uses: azure/setup-kubectl@8c1cc9a0ddce0451cd9ceba29e98ab85a4f7c07d  # v5.0.0
        with:
          version: 'latest'
      
      - name: Set up kubeconfig
        run: |
          mkdir -p $HOME/.kube
          base64 -d > $HOME/.kube/config << 'EOF'
          ${{ secrets.KUBECONFIG }}
          EOF
          chmod 600 $HOME/.kube/config

      - name: Restart cattle-cluster-agent deployment
        run: |
          echo "🔄 Restarting cattle-cluster-agent deployment..."
          kubectl rollout restart deployment cattle-cluster-agent -n cattle-system
          
          echo "⏳ Waiting for rollout to complete..."
          if kubectl rollout status deployment cattle-cluster-agent -n cattle-system --timeout=5m; then
            echo "✅ cattle-cluster-agent deployment restarted successfully"
          else
            echo "❌ Failed to restart cattle-cluster-agent deployment"
            exit 1
          fi

      - name: Verify deployment status
        run: |
          echo "📊 Checking deployment status..."
          kubectl get deployment cattle-cluster-agent -n cattle-system
          echo ""
          echo "Pod status in cattle-system namespace:"
          kubectl get pods -n cattle-system
