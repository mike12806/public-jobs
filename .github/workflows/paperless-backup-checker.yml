name: Check Paperless Export Backup

# Watchdog for gh_hdc's paperless-export-backup CronJob (gh_hdc
# kubernetes/paperless-export-backup/), which syncs Paperless's
# document_exporter output to B2 every night at 03:30 UTC and then writes a
# heartbeat object, paperless-export-status/last-success. This fails, and
# emails, when that heartbeat is older than MAX_AGE_HOURS.
#
# It runs here, on a GitHub-hosted runner, because it has to work when the
# cluster doesn't: it reads B2, not the cluster. If the lab is down so far
# that Vault is unreachable, the Vault step fails and the email step has no
# SMTP login; GitHub's own failed-run notification still goes out.
#
# Its B2 key (kv/ci/paperless-backup) has listFiles only, limited to the
# heartbeat's prefix: it can't read or even list documents. This repo is
# public, so the job prints the heartbeat's age and nothing else.
on:
  schedule:
    # 10:41 and 22:41 UTC. The first run after a missed 03:30 export finds the
    # heartbeat ~31h old, so a miss is reported within about 7 hours.
    - cron: "41 10,22 * * *"
  workflow_dispatch:

concurrency:
  group: paperless-backup-checker
  cancel-in-progress: true

permissions:
  id-token: write  # log in to Vault through GitHub OIDC
  contents: read

env:
  MAX_AGE_HOURS: "30"
  HEARTBEAT: paperless-export-status/last-success

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - name: Checkout (for the vault-secrets action)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: .github/actions

      - name: Read secrets from Vault
        uses: ./.github/actions/vault-secrets
        with:
          role: public-jobs
          hostname: github-runner-paperless-backup-checker
          secrets: |
            kv/data/ci/paperless-backup B2_ACCOUNT_ID | B2_ACCOUNT_ID ;
            kv/data/ci/paperless-backup B2_APPLICATION_KEY | B2_APPLICATION_KEY ;
            kv/data/ci/smtp EMAIL_FROM | EMAIL_FROM ;
            kv/data/ci/smtp EMAIL_TO | EMAIL_TO ;
            kv/data/ci/smtp SMTP_PASSWORD | SMTP_PASSWORD ;
            kv/data/ci/smtp SMTP_PORT | SMTP_PORT ;
            kv/data/ci/smtp SMTP_SERVER | SMTP_SERVER ;
            kv/data/ci/smtp SMTP_USERNAME | SMTP_USERNAME

      - name: Check the backup heartbeat's age
        id: check
        run: |
          set -euo pipefail

          fail() {
            echo "❌ $1"
            {
              echo "error<<EOF"
              echo "$1"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
            exit 1
          }

          # B2 native API. Responses are parsed, never printed: they carry the
          # auth token and the bucket's name and ID.
          auth=$(curl -fsS --max-time 30 -u "${B2_ACCOUNT_ID}:${B2_APPLICATION_KEY}" \
            https://api.backblazeb2.com/b2api/v3/b2_authorize_account) \
            || fail "Could not authorize with B2 (bad or revoked key in kv/ci/paperless-backup?)"
          token=$(jq -r '.authorizationToken' <<<"$auth")
          echo "::add-mask::${token}"
          api_url=$(jq -r '.apiInfo.storageApi.apiUrl' <<<"$auth")
          # b2api v3: a key limited to one bucket has it in storageApi.bucketId
          # (null for an all-buckets key).
          bucket_id=$(jq -r '.apiInfo.storageApi.bucketId // empty' <<<"$auth")
          [ -n "$bucket_id" ] || fail "The B2 key isn't limited to a bucket; it should be limited to the export bucket"

          body=$(jq -nc --arg b "$bucket_id" --arg f "$HEARTBEAT" \
            '{bucketId: $b, prefix: $f, startFileName: $f, maxFileCount: 1}')
          list=$(curl -fsS --max-time 30 -H "Authorization: ${token}" -d "$body" \
            "${api_url}/b2api/v3/b2_list_file_names") \
            || fail "Could not list the heartbeat in B2"
          uploaded_ms=$(jq -r --arg f "$HEARTBEAT" \
            '[.files[] | select(.fileName == $f) | .uploadTimestamp] | first // empty' <<<"$list")
          [ -n "$uploaded_ms" ] || fail "No heartbeat in B2: the export backup has never completed"

          age_hours=$(( ( $(date +%s) - uploaded_ms / 1000 ) / 3600 ))
          echo "Last successful export: $(date -u -d "@$(( uploaded_ms / 1000 ))" '+%Y-%m-%d %H:%M UTC') (${age_hours}h ago)"

          if [ "$age_hours" -gt "$MAX_AGE_HOURS" ]; then
            fail "The last successful Paperless export backup was ${age_hours} hours ago (threshold: ${MAX_AGE_HOURS}h). Check the paperless-export-backup CronJob in the paperless namespace."
          fi
          echo "✅ Paperless export backup is current"

      - name: Send email on failure
        # always(): without it this step is skipped once the check fails.
        # Keyed on the step's conclusion, so a hard failure also sends mail.
        if: always() && steps.check.conclusion == 'failure'
        uses: dawidd6/action-send-mail@27bf7a883db6de205849f760badd38a1a3ce0dd0  # v24
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: ${{ env.SMTP_PORT }}
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: "❌ Paperless export backup is stale"
          body: |
            The Paperless off-site backup check failed.

            ${{ steps.check.outputs.error || 'The check step failed before it could report results - see the workflow run for details.' }}

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          to: ${{ env.EMAIL_TO }}
          from: ${{ env.EMAIL_FROM }}
