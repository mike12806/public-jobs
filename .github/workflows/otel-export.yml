name: OTel log export

# Ships the logs of every other workflow run in this repo to
# https://otel.mfaherty.net/v1/logs once the run finishes. The exporter itself
# lives in mike12806/public-jobs (.github/workflows/otel-export-logs.yml);
# logs end up in ES as ks-logstash-log-github-actions.
#
# workflow_run only fires from this file as it exists on the default branch.
#
# Requires repo secrets OTEL_CF_ACCESS_CLIENT_ID / OTEL_CF_ACCESS_CLIENT_SECRET:
# a Cloudflare Access service token allowed by the otel.mfaherty.net Access
# application.

on:
  workflow_run:
    # Every workflow except this one.
    workflows: ["**", "!OTel log export"]
    types: [completed]

permissions: {}

jobs:
  export:
    # Skip runs from fork PRs: their output is attacker-controlled and would
    # otherwise be shipped with this repo's credentials.
    if: >-
      github.event.workflow_run.name != github.workflow &&
      github.event.workflow_run.head_repository.full_name == github.repository
    permissions:
      actions: read
    uses: mike12806/public-jobs/.github/workflows/otel-export-logs.yml@main
    secrets:
      OTEL_CF_ACCESS_CLIENT_ID: ${{ secrets.OTEL_CF_ACCESS_CLIENT_ID }}
      OTEL_CF_ACCESS_CLIENT_SECRET: ${{ secrets.OTEL_CF_ACCESS_CLIENT_SECRET }}
