name: IPv6 servers

# Runs gh_hdc's ansible/playbooks/playbook_ipv6_servers.yaml: Home LAN gets
# IPv6 for phones and laptops, and every server on it sees the same router
# advertisements. The playbook makes each LXC, Ubuntu VM and Proxmox host on
# Home LAN ignore them (inventories non_docker_lxc,
# non_kubernetes_ubuntu_vm_and_lxc, kubernetes_hosts and proxmox_hosts), so
# the servers stay on IPv4. Kubernetes nodes already boot with IPv6 off and
# hosts outside Home LAN are left alone; both are only reported.
#
#   - Nightly: dry run (--check). Emails a report if a server is not set to
#     ignore the advertisements (for example a new host in an inventory), or
#     if the run fails.
#   - Manual: dry run unless "apply" is ticked.
#
# The run's output also lists any host that still accepts advertisements
# through systemd-networkd or holds a public IPv6 address.
#
# This repo is public, so its logs are too. The playbook prints interface
# names and the hosts' LAN addresses, as the other fleet workflows do, and no
# secrets; it runs without --diff.

on:
  schedule:
    - cron: "57 8 * * *"  # 04:57 EDT, after the log shipping check
  workflow_dispatch:
    inputs:
      apply:
        description: 'Apply changes (unticked = dry run with --check)'
        type: boolean
        default: false
      gh_hdc_ref:
        description: 'gh_hdc branch/ref to run the playbook from'
        type: string
        default: main

concurrency:
  group: ipv6-servers
  cancel-in-progress: false

permissions:
  id-token: write  # log in to Vault through GitHub OIDC
  contents: read

jobs:
  ipv6-servers:
    runs-on: self-hosted
    timeout-minutes: 45

    steps:
      - name: Prefer IPv4 over IPv6
        run: |
          # Force IPv4 preference to avoid Tailscale IPv6 connectivity issues
          echo 'precedence ::ffff:0:0/96 100' | sudo tee -a /etc/gai.conf

      - name: Connect to Tailscale
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf  # v4.3.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: github-runner-ipv6-servers
          version: latest

      # Secrets come from Vault (kv/ci/*), logged in through GitHub OIDC with
      # the role below (gh_hdc vault/), so they're no longer GitHub secrets.
      - name: Read secrets from Vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc  # v4.0.0
        with:
          url: https://vault.mfaherty.net
          method: jwt
          path: github-actions
          role: public-jobs
          jwtGithubAudience: https://vault.mfaherty.net
          secrets: |
            kv/data/ci/github GH_HDC_PAT | GH_HDC_PAT ;
            kv/data/ci/smtp EMAIL_FROM | EMAIL_FROM ;
            kv/data/ci/smtp EMAIL_TO | EMAIL_TO ;
            kv/data/ci/smtp SMTP_PASSWORD | SMTP_PASSWORD ;
            kv/data/ci/smtp SMTP_PORT | SMTP_PORT ;
            kv/data/ci/smtp SMTP_SERVER | SMTP_SERVER ;
            kv/data/ci/smtp SMTP_USERNAME | SMTP_USERNAME ;
            kv/data/ci/ssh ANSIBLE_SSH_PASSWORD_1 | ANSIBLE_SSH_PASSWORD_1 ;
            kv/data/ci/ssh ANSIBLE_SSH_PASSWORD_3 | ANSIBLE_SSH_PASSWORD_3 ;
            kv/data/ci/ssh MIKEYSSHKEYLINODE | MIKEYSSHKEYLINODE

      - name: Checkout gh_hdc
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: mike12806/gh_hdc
          ref: ${{ inputs.gh_hdc_ref || 'main' }}
          token: ${{ env.GH_HDC_PAT }}
          path: gh_hdc

      - name: Write SSH Private Key to File
        env:
          SSH_KEY: ${{ env.MIKEYSSHKEYLINODE }}
        run: |
          printf '%s\n' "$SSH_KEY" | sed 's/\\n/\n/g' > /tmp/mike_ssh_key
          chmod 600 /tmp/mike_ssh_key

      - name: Run Ansible Playbook
        id: playbook
        working-directory: gh_hdc/ansible
        env:
          ANSIBLE_SSH_PASS: ${{ env.ANSIBLE_SSH_PASSWORD_1 }}
          PROXMOX_SSH_PASS: ${{ env.ANSIBLE_SSH_PASSWORD_3 }}
          ANSIBLE_PYTHON_INTERPRETER: /usr/bin/python3
          ANSIBLE_GATHERING: smart
          ANSIBLE_TIMEOUT: 30
          ANSIBLE_STDOUT_CALLBACK: ansible.builtin.default
          ANSIBLE_CALLBACK_RESULT_FORMAT: yaml
          ANSIBLE_HOST_KEY_CHECKING: false
          ANSIBLE_FORKS: 10
          APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
        run: |
          set -o pipefail
          mode=(--check)
          if [ "$APPLY" = "true" ]; then
            mode=()
            echo "::notice::Applying changes."
          else
            echo "::notice::Dry run (--check). Re-run with 'apply' ticked to make changes."
          fi
          run() {
            local pass=$1; shift
            ansible-playbook playbooks/playbook_ipv6_servers.yaml \
              "$@" \
              -u root \
              --private-key=/tmp/mike_ssh_key \
              "${mode[@]}" \
              --extra-vars "ansible_ssh_pass=${pass} ansible_ssh_common_args='-o StrictHostKeyChecking=no'"
          }
          # Both passes run even if the first fails; the step fails if either did.
          rc=0
          run "${ANSIBLE_SSH_PASS}" -i inventory/non_docker_lxc -i inventory/non_kubernetes_ubuntu_vm_and_lxc -i inventory/kubernetes_hosts \
            | tee "$RUNNER_TEMP/ipv6_servers.log" || rc=1
          run "${PROXMOX_SSH_PASS}" -i inventory/proxmox_hosts \
            | tee -a "$RUNNER_TEMP/ipv6_servers.log" || rc=1
          exit $rc

      # In a dry run any changed=N > 0 in the recap means a server is not
      # (or no longer) set to ignore IPv6 router advertisements, typically a
      # new host.
      - name: Check for drift
        id: drift
        if: always() && steps.playbook.outcome != 'skipped'
        env:
          APPLY: ${{ github.event_name == 'workflow_dispatch' && inputs.apply }}
          OUTCOME: ${{ steps.playbook.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          log="$RUNNER_TEMP/ipv6_servers.log"
          report="$RUNNER_TEMP/ipv6_servers_report.txt"
          recap=$(awk '/^PLAY RECAP/{f=1; next} f && /^$/{f=0} f' "$log")
          drifted=$(grep -E 'changed=[1-9]' <<<"$recap" | awk '{print $1}' | tr '\n' ' ')
          failed=$(grep -E '(unreachable|failed)=[1-9]' <<<"$recap" | awk '{print $1}' | tr '\n' ' ')
          if [ "$OUTCOME" = "failure" ]; then
            {
              echo "The IPv6 servers playbook failed on: ${failed:-see the run}"
              echo "Run: $RUN_URL"
              echo
              echo "$recap"
            } > "$report"
            echo "subject=❌ IPv6 servers playbook failed: ${failed}" >> "$GITHUB_OUTPUT"
          elif [ "$APPLY" != "true" ] && [ -n "$drifted" ]; then
            {
              echo "These servers are not set to ignore IPv6 router advertisements: $drifted"
              echo "Apply with the 'IPv6 servers' workflow (tick apply)."
              echo "Run: $RUN_URL"
              echo
              echo "$recap"
            } > "$report"
            echo "subject=⚠️ Servers accepting IPv6 router advertisements: $drifted" >> "$GITHUB_OUTPUT"
            echo "::warning::Drift on: $drifted"
          fi

      - name: Email the report
        if: always() && github.event_name == 'schedule' && steps.drift.outputs.subject != ''
        uses: dawidd6/action-send-mail@47af4a10b540781705f283a2cf1a9650713ac795  # v23
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: ${{ env.SMTP_PORT }}
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: ${{ steps.drift.outputs.subject }}
          body: file://${{ runner.temp }}/ipv6_servers_report.txt
          to: ${{ env.EMAIL_TO }}
          from: ${{ env.EMAIL_FROM }}

      - name: Cleanup Temporary Files
        if: always()
        run: |
          rm -f /tmp/mike_ssh_key "$RUNNER_TEMP/ipv6_servers.log" "$RUNNER_TEMP/ipv6_servers_report.txt"
