name: Linode Backup Check

# Every Linode instance on the account must have Linode's backup service on,
# with a successful backup (automatic, or the manual snapshot slot) in the
# last MAX_AGE_HOURS. The instances are listed from the API on every run, so
# a new one is checked without editing this file. Fails, naming each instance
# that isn't covered.
#
# enable_missing (manual runs only) turns backups on for any instance that
# has them off. That adds Linode's backup charge for that instance to the
# bill, so it's never done by the schedule. Its first backup comes in the
# next daily window; until then the check keeps failing for it.

on:
  schedule:
    - cron: "0 6,18 * * *"  # Runs twice daily at 6:00 AM and 6:00 PM UTC
  workflow_dispatch:  # Allows manual triggering from the GitHub Actions UI
    inputs:
      enable_missing:
        description: "Turn backups on for instances that have them off (adds to the Linode bill)"
        type: boolean
        default: false

concurrency:
  group: linode_backup_checker
  cancel-in-progress: true

permissions:
  id-token: write  # log in to Vault through GitHub OIDC
  contents: read

env:
  MAX_AGE_HOURS: 48

jobs:
  check-backups:
    runs-on: self-hosted
    timeout-minutes: 30

    steps:
      # Vault is reached over Tailscale.
      - name: Connect to Tailscale
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf  # v4.3.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: github-runner-linode-backup
          version: latest

      # Secrets come from Vault (kv/ci/*), logged in through GitHub OIDC with
      # the role below (gh_hdc vault/), so they're no longer GitHub secrets.
      - name: Read secrets from Vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc  # v4.0.0
        with:
          url: https://vault.mfaherty.net
          method: jwt
          path: github-actions
          role: public-jobs
          jwtGithubAudience: https://vault.mfaherty.net
          secrets: |
            kv/data/ci/linode LINODE_CLI_TOKEN | LINODE_TOKEN

      - name: Turn backups on where they're off
        if: github.event_name == 'workflow_dispatch' && inputs.enable_missing
        run: |
          set -euo pipefail
          api() { curl -fsS -H "Authorization: Bearer $LINODE_TOKEN" -H 'Content-Type: application/json' "$@"; }
          api 'https://api.linode.com/v4/linode/instances?page_size=500' \
            | jq -r '.data[] | select(.backups.enabled | not) | "\(.id) \(.label)"' \
            | while read -r id label; do
                api -X POST "https://api.linode.com/v4/linode/instances/$id/backups/enable" > /dev/null
                echo "Turned backups on for $label ($id)."
                echo "- Turned backups on for **$label** ($id)" >> "$GITHUB_STEP_SUMMARY"
              done

      - name: Check every instance
        run: |
          set -euo pipefail
          api() { curl -fsS -H "Authorization: Bearer $LINODE_TOKEN" "$@"; }
          instances="$(api 'https://api.linode.com/v4/linode/instances?page_size=500')"
          count="$(jq '.data | length' <<<"$instances")"
          if [ "$count" -eq 0 ]; then
            echo "::error::The API listed no Linode instances; check the token."
            exit 1
          fi
          now="$(date -u +%s)"
          bad=0
          {
            echo "### Linode backups (latest successful must be under ${MAX_AGE_HOURS} h old)"
            echo
            echo "| Instance | ID | Backups | Latest successful (UTC) | Age | |"
            echo "|---|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          while read -r id label enabled; do
            if [ "$enabled" != true ]; then
              echo "::error::$label ($id): backups are off."
              echo "| $label | $id | off | | | ❌ |" >> "$GITHUB_STEP_SUMMARY"
              bad=1
              continue
            fi
            latest="$(api "https://api.linode.com/v4/linode/instances/$id/backups" | jq -r '
              [(.automatic // [])[], (.snapshot.current // empty)]
              | map(select(.status == "successful" and .finished != null) | .finished)
              | sort | last // ""')"
            if [ -z "$latest" ]; then
              echo "::error::$label ($id): no successful backup yet."
              echo "| $label | $id | on | none | | ❌ |" >> "$GITHUB_STEP_SUMMARY"
              bad=1
              continue
            fi
            age_h=$(( (now - $(date -u -d "${latest}Z" +%s)) / 3600 ))
            if [ "$age_h" -ge "$MAX_AGE_HOURS" ]; then
              echo "::error::$label ($id): latest successful backup is ${age_h} h old ($latest UTC)."
              echo "| $label | $id | on | $latest | ${age_h} h | ❌ |" >> "$GITHUB_STEP_SUMMARY"
              bad=1
            else
              echo "✅ $label ($id): latest successful backup $latest UTC (${age_h} h ago)."
              echo "| $label | $id | on | $latest | ${age_h} h | ✅ |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done < <(jq -r '.data[] | "\(.id) \(.label) \(.backups.enabled)"' <<<"$instances")
          echo "Checked $count instances."
          exit "$bad"
