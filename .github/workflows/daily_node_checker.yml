name: Check Kubernetes Node Health

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    - cron: '15 10 * * *'  # 6:15 AM Eastern Time (10:15 UTC)

jobs:
  check-k8s-nodes:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout gh_hdc
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: mike12806/gh_hdc
          token: ${{ secrets.GH_HDC_PAT }}
          path: gh_hdc

      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888  # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: github-runner-daily-node-checker
          version: latest

      - name: Setup kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d  # v5.1.0
        with:
          version: 'latest'
      
      - name: Set up kubeconfig
        run: |
          mkdir -p $HOME/.kube
          base64 -d > $HOME/.kube/config << 'EOF'
          ${{ secrets.KUBECONFIG }}
          EOF
          chmod 600 $HOME/.kube/config
          # Verify kubectl can connect to the cluster
          kubectl cluster-info
          if [ $? -ne 0 ]; then
            echo "Failed to connect to the cluster"
            kubectl config view --minify
            exit 1
          fi

      - name: Check node readiness
        id: check_nodes
        run: |
          set -uo pipefail

          # Multi-line values need heredoc syntax; bare lines in $GITHUB_ENV are
          # an "Invalid format" error, which is what the old alert path emitted
          # instead of a body.
          emit() {
            echo "status=$1" >> "$GITHUB_OUTPUT"
            {
              echo "subject=$2"
              echo "body<<NODE_CHECK_EOF"
              cat
              echo "NODE_CHECK_EOF"
            } >> "$GITHUB_ENV"
          }

          # kubectl's failure used to be invisible: its output fed a pipeline
          # whose exit status is grep's, under a `|| true` that swallowed the
          # rest. An unreachable API left NOT_READY empty, and empty was read as
          # "every node is Ready" -- so the one job whose purpose is to report an
          # outage reported a tick. Unknown is not healthy; say so.
          if ! NODES_JSON=$(kubectl get nodes -o json 2>&1); then
            emit FAIL "❌ K8s node check could NOT reach the cluster" <<EOF
          kubectl could not list nodes, so node health is UNKNOWN.
          This is not a report that the nodes are healthy.

          $NODES_JSON
          EOF
            exit 0
          fi

          NODE_COUNT=$(printf '%s' "$NODES_JSON" | jq '.items | length')
          if [ "$NODE_COUNT" -eq 0 ]; then
            emit FAIL "❌ K8s node check returned no nodes at all" <<EOF
          kubectl succeeded but reported zero nodes, which is never correct for
          this cluster. Treating it as a failure rather than as "nothing wrong".
          EOF
            exit 0
          fi

          NOT_READY=$(printf '%s' "$NODES_JSON" | jq -r '
            .items[]
            | select([.status.conditions[] | select(.type == "Ready" and .status == "True")] | length == 0)
            | .metadata.name')

          PENDING_REBOOT=$(printf '%s' "$NODES_JSON" | jq -r '.items[] | select(.spec.taints != null) | select(.spec.taints[] | select(.key == "weave.works/kured-node-reboot" and .value == "true")) | .metadata.name')

          if [ -z "$NOT_READY" ] && [ -z "$PENDING_REBOOT" ]; then
            emit OK "✅ All K8s Nodes Ready" <<EOF
          All $NODE_COUNT nodes in your Kubernetes cluster are Ready and no nodes
          are pending reboot.
          EOF
          else
            {
              echo "The following issues were detected across $NODE_COUNT nodes:"
              echo
              if [ -n "$NOT_READY" ]; then
                echo "Nodes not in Ready state:"
                echo "$NOT_READY"
                echo
              fi
              if [ -n "$PENDING_REBOOT" ]; then
                echo "Nodes pending reboot:"
                echo "$PENDING_REBOOT"
              fi
            } | emit FAIL "❌ K8s Nodes Issue Detected"
          fi

      - name: Send email
        if: always()
        uses: dawidd6/action-send-mail@ca8dbb4d4f91ca7f75e7f2feea5339e76ce70c90  # v20
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: ${{ env.subject }}
          body: ${{ env.body }}
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.EMAIL_FROM }}
