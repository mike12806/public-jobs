name: Check Renovate Health

# Both self-hosted Renovate instances (namespace renovate for Gitea/hdc and
# renovate-github for GitHub) run as Kubernetes CronJobs every 20 minutes.
# From 2026-09-13 to 2026-09-26 every run crashed on start (Renovate 44.78.0
# was missing its common-tags dependency), but the process exited 0, so each
# Job showed Complete and nothing alerted for 13 days (gh_hdc #3650). Job status
# can't catch that, so this reads the newest finished run's log in each
# namespace and emails if it didn't complete a repository, crashed, or is
# older than 90 minutes.

on:
  schedule:
    - cron: '50 * * * *'  # hourly, at minute 50
  workflow_dispatch:

concurrency:
  group: renovate-health-check
  cancel-in-progress: true

permissions:
  id-token: write  # log in to Vault through GitHub OIDC
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd  # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: github-runner-renovate-health
          version: latest

      # Secrets come from Vault (kv/ci/*), logged in through GitHub OIDC with
      # the role below (gh_hdc vault/), so they're no longer GitHub secrets.
      - name: Read secrets from Vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc  # v4.0.0
        with:
          url: https://vault.mfaherty.net
          method: jwt
          path: github-actions
          role: public-jobs
          jwtGithubAudience: https://vault.mfaherty.net
          secrets: |
            kv/data/ci/kubernetes KUBECONFIG | KUBECONFIG_B64 ;
            kv/data/ci/smtp EMAIL_FROM | EMAIL_FROM ;
            kv/data/ci/smtp EMAIL_TO | EMAIL_TO ;
            kv/data/ci/smtp SMTP_PASSWORD | SMTP_PASSWORD ;
            kv/data/ci/smtp SMTP_PORT | SMTP_PORT ;
            kv/data/ci/smtp SMTP_SERVER | SMTP_SERVER ;
            kv/data/ci/smtp SMTP_USERNAME | SMTP_USERNAME

      - name: Setup kubectl
        uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e  # v5.2.0
        with:
          version: 'latest'

      - name: Set up kubeconfig
        run: |
          mkdir -p $HOME/.kube
          base64 -d > $HOME/.kube/config << 'EOF'
          ${{ env.KUBECONFIG_B64 }}
          EOF
          chmod 600 $HOME/.kube/config
          if ! python3 -c "import yaml; yaml.safe_load(open('$HOME/.kube/config'))" 2>/dev/null; then
            echo "ERROR: kubeconfig is not valid YAML"
            exit 1
          fi

      - name: Wait for the API server to accept our credentials
        run: |
          set -euo pipefail
          export KUBECONFIG=$HOME/.kube/config
          # Ride out a short API blip
          # instead of reporting it as a Renovate failure.
          deadline=$((SECONDS + 180)); delay=5
          until err=$(kubectl cluster-info 2>&1 >/dev/null); do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::API server still rejecting or refusing kubectl after ${SECONDS}s"
              printf '%s\n' "$err"; exit 1
            fi
            echo "API server not usable yet, retrying in ${delay}s"; sleep "$delay"
            delay=$(( delay < 30 ? delay * 2 : 30 ))
          done

      - name: Check newest Renovate run in each namespace
        id: check_renovate
        env:
          KUBECONFIG: /home/runner/.kube/config
          MAX_AGE_MIN: '90'
        run: |
          set -uo pipefail
          MAX_AGE_MIN=${MAX_AGE_MIN:-90}
          now=$(date -u +%s)
          failures=""
          for ns in renovate renovate-github; do
            pod_json=$(kubectl -n "$ns" get pods -o json 2>&1) || { failures+="- $ns: kubectl get pods failed: $pod_json\n"; continue; }
            newest=$(jq -r '[.items[] | select(.status.phase=="Succeeded" or .status.phase=="Failed")
                             | {name: .metadata.name, phase: .status.phase,
                                done: (.status.containerStatuses[0].state.terminated.finishedAt // .status.startTime)}]
                            | sort_by(.done) | last | if . == null then "" else "\(.name) \(.phase) \(.done)" end' <<<"$pod_json")
            if [ -z "$newest" ]; then failures+="- $ns: no finished Renovate run retained in the namespace\n"; continue; fi
            read -r pod phase done_at <<<"$newest"
            age_min=$(( (now - $(date -u -d "$done_at" +%s 2>/dev/null || date -u -j -f "%Y-%m-%dT%H:%M:%SZ" "$done_at" +%s)) / 60 ))
            logs=$(kubectl -n "$ns" logs "$pod" 2>&1) || { failures+="- $ns: could not read logs of $pod\n"; continue; }
            finished=$(grep -c "Repository finished" <<<"$logs" || true)
            # Only match Renovate's own log-line prefixes. At LOG_LEVEL debug the log
            # also contains PR bodies, which can quote these words (a PR about this very
            # crash did, and tripped the first version of this check).
            crash=$(grep -m3 -E "^ *(FATAL: |ERROR: (unhandledRejection|uncaughtException)|(INFO|WARN|ERROR|FATAL): Renovate is exiting with a non-zero code)" <<<"$logs" | cut -c1-200 || true)
            echo "$ns: newest finished run $pod ($phase) ${age_min}m ago; 'Repository finished' x$finished"
            if [ "$age_min" -gt "$MAX_AGE_MIN" ]; then failures+="- $ns: newest finished run $pod is ${age_min} min old (limit ${MAX_AGE_MIN}); is the CronJob running?\n"; fi
            if [ -n "$crash" ] || [ "$finished" -eq 0 ]; then
              failures+="- $ns: run $pod did not complete a repository"
              [ -n "$crash" ] && failures+=". First errors:\n$(sed 's/^/    /' <<<"$crash")"
              failures+="\n"
            fi
          done
          if [ -n "$failures" ]; then
            printf '\nUNHEALTHY:\n%b' "$failures"
            { echo "error<<EOF"; printf '%b' "$failures"; echo "EOF"; } >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "All Renovate instances healthy."

      - name: Send email on failure
        # always(): otherwise skipped once the check step exits non-zero. Keyed
        # on that step so a cluster-unreachable failure mails too.
        if: always() && steps.check_renovate.conclusion == 'failure'
        uses: dawidd6/action-send-mail@67ce3558d613188179559c61d3565140cf389968  # v22
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: ${{ env.SMTP_PORT }}
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: "❌ Renovate is not completing runs"
          body: |
            The Renovate health check failed. Renovate may be crashing on every run
            (its Jobs can still show Complete).

            ${{ steps.check_renovate.outputs.error || 'The check step failed before it could report results - see the workflow run for details.' }}

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          to: ${{ env.EMAIL_TO }}
          from: ${{ env.EMAIL_FROM }}
