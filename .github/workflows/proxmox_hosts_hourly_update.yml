name: Hourly Proxmox Host Update Check

on:
  schedule:
    - cron: "19 * * * *"  # Runs hourly at minute 19 (staggered off the top of the hour)
  workflow_dispatch:  # Allows manual triggering from Gitea Actions UI

concurrency:
  group: proxmox_hosts_hourly_update
  cancel-in-progress: true

permissions:
  id-token: write  # log in to Vault through GitHub OIDC
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 90

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@99a8333667fff04fdd6cffb46dfd409f8329a7bf  # v4.3.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: github-runner-proxmox-hosts
          version: latest

      # Secrets come from Vault (kv/ci/*), logged in through GitHub OIDC with
      # the role below (gh_hdc vault/), so they're no longer GitHub secrets.
      - name: Read secrets from Vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc  # v4.0.0
        with:
          url: https://vault.mfaherty.net
          method: jwt
          path: github-actions
          role: public-jobs
          jwtGithubAudience: https://vault.mfaherty.net
          secrets: |
            kv/data/ci/github GH_HDC_PAT | GH_HDC_PAT ;
            kv/data/ci/smtp EMAIL_FROM | EMAIL_FROM ;
            kv/data/ci/smtp EMAIL_TO | EMAIL_TO ;
            kv/data/ci/smtp SMTP_PASSWORD | SMTP_PASSWORD ;
            kv/data/ci/smtp SMTP_PORT | SMTP_PORT ;
            kv/data/ci/smtp SMTP_SERVER | SMTP_SERVER ;
            kv/data/ci/smtp SMTP_USERNAME | SMTP_USERNAME ;
            kv/data/ci/ssh ANSIBLE_SSH_PASSWORD_3 | ANSIBLE_SSH_PASSWORD_3 ;
            kv/data/ci/ssh MIKESSHKEYLINODEPUB | MIKESSHKEYLINODEPUB ;
            kv/data/ci/ssh MIKEYSSHKEYLINODE | MIKEYSSHKEYLINODE

      - name: Checkout gh_hdc
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: mike12806/gh_hdc
          token: ${{ env.GH_HDC_PAT }}
          path: gh_hdc

      - name: Write SSH Private Key to File
        run: |
          echo "${{ env.MIKEYSSHKEYLINODE }}" | sed 's/\\n/\n/g' > /tmp/mike_ssh_key
          chmod 600 /tmp/mike_ssh_key

      - name: Write SSH Public Key to File
        run: |
          mkdir -p ~/.ssh
          echo "${{ env.MIKESSHKEYLINODEPUB }}" | sed 's/\\n/\n/g' >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys

      - name: Run Ansible Playbook
        working-directory: gh_hdc/ansible  # Correct path
        env:
          ANSIBLE_SSH_PASS_3: ${{ env.ANSIBLE_SSH_PASSWORD_3 }}
          ANSIBLE_PYTHON_INTERPRETER: /usr/bin/python3
          ANSIBLE_GATHERING: smart
          ANSIBLE_TIMEOUT: 30
          ANSIBLE_STDOUT_CALLBACK: ansible.builtin.default
          ANSIBLE_CALLBACK_RESULT_FORMAT: yaml
          ANSIBLE_HOST_KEY_CHECKING: false
        run: |
          ansible-playbook playbooks/playbook_proxmox_updates.yaml \
            -i inventory/proxmox_hosts \
            -u root \
            --private-key=/tmp/mike_ssh_key \
            --extra-vars "ansible_ssh_pass=${ANSIBLE_SSH_PASS_3} ansible_ssh_common_args='-o StrictHostKeyChecking=no'" \
            --extra-vars "swap_thrash_report=${RUNNER_TEMP}/swap_thrash_report.txt"

      # The playbook writes this report only when a host is swap thrashing.
      - name: Check for swap thrashing
        id: thrash
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/swap_thrash_report.txt" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Email swap thrashing report
        if: always() && steps.thrash.outputs.found == 'true'
        uses: dawidd6/action-send-mail@47af4a10b540781705f283a2cf1a9650713ac795  # v23
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: ${{ env.SMTP_PORT }}
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: "⚠️ Swap thrashing on Proxmox host(s)"
          body: file://${{ runner.temp }}/swap_thrash_report.txt
          to: ${{ env.EMAIL_TO }}
          from: ${{ env.EMAIL_FROM }}

      - name: Cleanup
        if: always()
        run: |
          rm -f /tmp/mike_ssh_key
          rm -f "$RUNNER_TEMP/swap_thrash_report.txt"
          rm -rf ~/.ssh/authorized_keys
          rm -rf ~/.ssh
