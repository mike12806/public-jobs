name: Check CloudNativePG Backups and WAL Archiving

on:
  schedule:
    - cron: '15 * * * *'  # Run every hour at minute 15
  workflow_dispatch:  # Allow manual trigger

concurrency:
  group: cnpg-backup-checker
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-cnpg-backups:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout gh_hdc
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: mike12806/gh_hdc
          token: ${{ secrets.GH_HDC_PAT }}
          path: gh_hdc

      - name: Connect to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888  # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: github-runner-cnpg-backup-checker
          version: latest

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y jq

      - name: Setup kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d  # v5.1.0
        with:
          version: 'latest'
      
      - name: Set up kubeconfig
        run: |
          mkdir -p $HOME/.kube
          base64 -d > $HOME/.kube/config << 'EOF'
          ${{ secrets.KUBECONFIG }}
          EOF
          chmod 600 $HOME/.kube/config

      - name: Check CNPG Cluster Backups and WAL Archiving
        id: check_cnpg
        run: |
          set -euo pipefail
          
          echo "🔍 Checking CloudNativePG clusters..."
          
          # Get all CNPG clusters
          CLUSTERS=$(kubectl -n cloudnative-pg get clusters.postgresql.cnpg.io -o jsonpath='{.items[*].metadata.name}')
          
          if [ -z "$CLUSTERS" ]; then
            echo "❌ No CNPG clusters found"
            echo "status=FAIL" >> $GITHUB_OUTPUT
            echo "error=No CNPG clusters found in cloudnative-pg namespace" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          FAILED_CHECKS=""
          ALL_PASSED=true
          
          for CLUSTER in $CLUSTERS; do
            echo ""
            echo "📊 Checking cluster: $CLUSTER"
            echo "─────────────────────────────────────"
            
            # Get cluster status
            CLUSTER_STATUS=$(kubectl -n cloudnative-pg get clusters.postgresql.cnpg.io $CLUSTER -o jsonpath='{.status.phase}')
            echo "  Status: $CLUSTER_STATUS"
            
            if [ "$CLUSTER_STATUS" != "Cluster in healthy state" ]; then
              echo "  ❌ Cluster is not healthy"
              FAILED_CHECKS="${FAILED_CHECKS}${CLUSTER}: Cluster not healthy (status: $CLUSTER_STATUS)\n"
              ALL_PASSED=false
              continue
            fi
            
            # Check WAL archiving status
            WAL_ARCHIVING=$(kubectl -n cloudnative-pg get clusters.postgresql.cnpg.io $CLUSTER -o jsonpath='{.status.conditions[?(@.type=="ContinuousArchiving")].status}')
            WAL_MESSAGE=$(kubectl -n cloudnative-pg get clusters.postgresql.cnpg.io $CLUSTER -o jsonpath='{.status.conditions[?(@.type=="ContinuousArchiving")].message}')
            
            echo "  WAL Archiving: $WAL_ARCHIVING"
            
            if [ "$WAL_ARCHIVING" != "True" ]; then
              echo "  ❌ WAL archiving is not working: $WAL_MESSAGE"
              FAILED_CHECKS="${FAILED_CHECKS}${CLUSTER}: WAL archiving failing - $WAL_MESSAGE\n"
              ALL_PASSED=false
            else
              echo "  ✅ WAL archiving is working"
            fi
            
            # Check last backup status using the Backup CRs.
            # NOTE: this deliberately does NOT use kubectl events. Events have a
            # 1h TTL on this cluster, so with daily backups the "Completed" event
            # has expired for ~23 of this job's 24 hourly runs. Backup CRs persist.
            SCHEDULED_BACKUPS=$(kubectl -n cloudnative-pg get scheduledbackup -o json | jq -r ".items[] | select(.spec.cluster.name==\"$CLUSTER\") | .metadata.name")

            if [ -z "$SCHEDULED_BACKUPS" ]; then
              echo "  ⚠️  No scheduled backup found for this cluster"
            fi

            ALL_BACKUPS=$(kubectl -n cloudnative-pg get backups.postgresql.cnpg.io -o json)

            # Most recent successfully completed backup for this cluster
            LAST_COMPLETED=$(echo "$ALL_BACKUPS" | jq -r --arg c "$CLUSTER" '
              [ .items[]
                | select(.spec.cluster.name == $c)
                | select(.status.phase == "completed")
                | select(.status.stoppedAt != null) ]
              | sort_by(.status.stoppedAt) | last // empty')

            if [ -z "$LAST_COMPLETED" ]; then
              echo "    ❌ No completed backups found for this cluster"
              FAILED_CHECKS="${FAILED_CHECKS}${CLUSTER}: No completed backups found\n"
              ALL_PASSED=false
            else
              LAST_BACKUP_TIME=$(echo "$LAST_COMPLETED" | jq -r '.status.stoppedAt')
              BACKUP_NAME=$(echo "$LAST_COMPLETED" | jq -r '.metadata.name')

              echo "    Latest successful backup: $BACKUP_NAME at $LAST_BACKUP_TIME"

              # Any failed backups since that success mean backups are broken now
              FAILED_SINCE=$(echo "$ALL_BACKUPS" | jq -r --arg c "$CLUSTER" --arg since "$LAST_BACKUP_TIME" '
                [ .items[]
                  | select(.spec.cluster.name == $c)
                  | select(.status.phase == "failed")
                  | select(.metadata.creationTimestamp > $since) ]
                | length')

              if [ "$FAILED_SINCE" -gt 0 ]; then
                LAST_ERROR=$(echo "$ALL_BACKUPS" | jq -r --arg c "$CLUSTER" --arg since "$LAST_BACKUP_TIME" '
                  [ .items[]
                    | select(.spec.cluster.name == $c)
                    | select(.status.phase == "failed")
                    | select(.metadata.creationTimestamp > $since) ]
                  | sort_by(.metadata.creationTimestamp) | last
                  | "\(.metadata.name): \(.status.error // "unknown error")"')
                echo "    ❌ ${FAILED_SINCE} failed backup(s) since the last success"
                echo "       Most recent: $LAST_ERROR"
                FAILED_CHECKS="${FAILED_CHECKS}${CLUSTER}: ${FAILED_SINCE} failed backup(s) since last success - ${LAST_ERROR}\n"
                ALL_PASSED=false
              fi

              # Check backup age
              BACKUP_TIMESTAMP=$(date -d "$LAST_BACKUP_TIME" +%s 2>/dev/null || echo "0")
              CURRENT_TIMESTAMP=$(date +%s)
              AGE_HOURS=$(( ($CURRENT_TIMESTAMP - $BACKUP_TIMESTAMP) / 3600 ))

              echo "    Backup age: ${AGE_HOURS} hours"

              if [ $AGE_HOURS -gt 48 ]; then
                echo "    ❌ Backup is older than 48 hours"
                FAILED_CHECKS="${FAILED_CHECKS}${CLUSTER}: Latest backup is ${AGE_HOURS} hours old (threshold: 48 hours)\n"
                ALL_PASSED=false
              else
                echo "    ✅ Backup is recent (< 48 hours)"
              fi
            fi
            
            echo "─────────────────────────────────────"
          done
          
          echo ""
          if [ "$ALL_PASSED" = true ]; then
            echo "✅ All CNPG cluster checks passed"
            echo "status=PASS" >> $GITHUB_OUTPUT
          else
            echo "❌ Some CNPG cluster checks failed:"
            echo -e "$FAILED_CHECKS"
            echo "status=FAIL" >> $GITHUB_OUTPUT
            echo "error<<EOF" >> $GITHUB_OUTPUT
            echo -e "$FAILED_CHECKS" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Send email on failure
        if: steps.check_cnpg.outputs.status == 'FAIL'
        uses: dawidd6/action-send-mail@94de994a9f6fffee200243214e17002e2920bb59  # v18
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: "❌ CloudNativePG Backup/WAL Check Failed"
          body: |
            CloudNativePG health check failed.
            
            Failures detected:
            ${{ steps.check_cnpg.outputs.error }}
            
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.EMAIL_FROM }}

