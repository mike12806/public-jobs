name: "Vault: seed CI secrets"

# One-time copy of this repo's GitHub secrets into Vault (kv/ci/<group>),
# keyed by their GitHub names, so workflows can read them from Vault through
# GitHub OIDC instead. Logs in as public-jobs-seed (gh_hdc vault/), which can
# only write kv/ci/* and only from this workflow on main, run by hand.
#
# Each value is read back and compared by checksum; the log only says ok,
# MISMATCH, or "not set in GitHub". Re-running overwrites with the current
# GitHub values. Not moved: TS_OAUTH_* (needed to reach Vault at all) and
# VAULT_TOKEN (replaced by OIDC).

on:
  workflow_dispatch:

concurrency:
  group: vault-seed-ci-secrets
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      VAULT_ADDR: https://vault.mfaherty.net
      VAULT_VERSION: 2.1.0
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd  # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: github-runner-vault-seed
          version: latest

      - name: Install the Vault CLI
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://releases.hashicorp.com/vault/${VAULT_VERSION}/vault_${VAULT_VERSION}_linux_amd64.zip"
          curl -fsSLO "https://releases.hashicorp.com/vault/${VAULT_VERSION}/vault_${VAULT_VERSION}_SHA256SUMS"
          grep linux_amd64 "vault_${VAULT_VERSION}_SHA256SUMS" | sha256sum -c -
          unzip -oq "vault_${VAULT_VERSION}_linux_amd64.zip" -d bin
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Log in to Vault with GitHub OIDC
        run: |
          set -euo pipefail
          jwt=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://vault.mfaherty.net" | jq -r .value)
          token=$(printf '%s' "$jwt" | vault write -field=token auth/github-actions/login role=public-jobs-seed jwt=-)
          echo "::add-mask::${token}"
          echo "VAULT_TOKEN=${token}" >> "$GITHUB_ENV"

      - name: Copy the secrets into Vault and check them
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          MIKEYSSHKEYLINODE: ${{ secrets.MIKEYSSHKEYLINODE }}
          MIKESSHKEYLINODEPUB: ${{ secrets.MIKESSHKEYLINODEPUB }}
          ANSIBLE_SSH_PASSWORD_1: ${{ secrets.ANSIBLE_SSH_PASSWORD_1 }}
          ANSIBLE_SSH_PASSWORD_3: ${{ secrets.ANSIBLE_SSH_PASSWORD_3 }}
          PVE_TOKEN_ID: ${{ secrets.PVE_TOKEN_ID }}
          PVE_SECRET: ${{ secrets.PVE_SECRET }}
          PVE2_TOKEN_ID: ${{ secrets.PVE2_TOKEN_ID }}
          PVE2_SECRET: ${{ secrets.PVE2_SECRET }}
          PVE3_TOKEN_ID: ${{ secrets.PVE3_TOKEN_ID }}
          PVE3_SECRET: ${{ secrets.PVE3_SECRET }}
          PVE4_TOKEN_ID: ${{ secrets.PVE4_TOKEN_ID }}
          PVE4_SECRET: ${{ secrets.PVE4_SECRET }}
          PVE5_TOKEN_ID: ${{ secrets.PVE5_TOKEN_ID }}
          PVE5_SECRET: ${{ secrets.PVE5_SECRET }}
          PVE6_TOKEN_ID: ${{ secrets.PVE6_TOKEN_ID }}
          PVE6_SECRET: ${{ secrets.PVE6_SECRET }}
          PVE7_TOKEN_ID: ${{ secrets.PVE7_TOKEN_ID }}
          PVE7_SECRET: ${{ secrets.PVE7_SECRET }}
          KUBECONFIG: ${{ secrets.KUBECONFIG }}
          GH_HDC_PAT: ${{ secrets.GH_HDC_PAT }}
          PRIVATE_GITHUB_TOKEN: ${{ secrets.PRIVATE_GITHUB_TOKEN }}
          PRIVATE_GIT_TOKEN: ${{ secrets.PRIVATE_GIT_TOKEN }}
          PRIVATE_GIT_USERNAME: ${{ secrets.PRIVATE_GIT_USERNAME }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          LINODE_CLI_TOKEN: ${{ secrets.LINODE_CLI_TOKEN }}
          LINODE_ID_1: ${{ secrets.LINODE_ID_1 }}
          LINODE_ID_2: ${{ secrets.LINODE_ID_2 }}
          ES_BASE_URL: ${{ secrets.ES_BASE_URL }}
          ES_USER: ${{ secrets.ES_USER }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          TRUENAS_API_KEY: ${{ secrets.TRUENAS_API_KEY }}
          TRUENAS_API_URL: ${{ secrets.TRUENAS_API_URL }}
          K8S_DB_NAME: ${{ secrets.K8S_DB_NAME }}
          K8S_DB_USER: ${{ secrets.K8S_DB_USER }}
          K8S_DB_PASSWORD: ${{ secrets.K8S_DB_PASSWORD }}
          K8S_DB_PRIMARY: ${{ secrets.K8S_DB_PRIMARY }}
          K8S_DB_SECONDARY: ${{ secrets.K8S_DB_SECONDARY }}
          K8S_DB_TERTIARY: ${{ secrets.K8S_DB_TERTIARY }}
          PRIMARY_PIHOLE_IP_AND_PORT: ${{ secrets.PRIMARY_PIHOLE_IP_AND_PORT }}
          PRIMARY_PIHOLE_TOKEN: ${{ secrets.PRIMARY_PIHOLE_TOKEN }}
        run: |
          set -uo pipefail
          problems=0
          # put GROUP NAME...: writes the non-empty named variables to kv/ci/GROUP,
          # then compares each stored value with the GitHub one by checksum.
          put() {
            local group=$1; shift
            jq -n '[$ARGS.positional[] as $k | {key: $k, value: (env[$k] // "")}] | map(select(.value != "")) | from_entries' --args "$@" \
              | vault kv put -mount=kv "ci/${group}" - >/dev/null || { echo "::error::writing ci/${group} failed"; problems=$((problems + 1)); return; }
            local stored; stored=$(vault kv get -mount=kv -format=json "ci/${group}")
            for k in "$@"; do
              if [ -z "${!k:-}" ]; then echo "  ci/${group} ${k}: not set in GitHub, skipped"; continue; fi
              if [ "$(jq -r --arg k "$k" '.data.data[$k]' <<<"$stored" | sha256sum)" = "$(printf '%s\n' "${!k}" | sha256sum)" ]; then
                echo "  ci/${group} ${k}: ok"
              else
                echo "::error::ci/${group} ${k}: MISMATCH"; problems=$((problems + 1))
              fi
            done
          }
          put smtp SMTP_SERVER SMTP_PORT SMTP_USERNAME SMTP_PASSWORD EMAIL_FROM EMAIL_TO
          put ssh MIKEYSSHKEYLINODE MIKESSHKEYLINODEPUB ANSIBLE_SSH_PASSWORD_1 ANSIBLE_SSH_PASSWORD_3
          put proxmox PVE_TOKEN_ID PVE_SECRET PVE2_TOKEN_ID PVE2_SECRET PVE3_TOKEN_ID PVE3_SECRET PVE4_TOKEN_ID PVE4_SECRET PVE5_TOKEN_ID PVE5_SECRET PVE6_TOKEN_ID PVE6_SECRET PVE7_TOKEN_ID PVE7_SECRET
          put kubernetes KUBECONFIG
          put github GH_HDC_PAT PRIVATE_GITHUB_TOKEN PRIVATE_GIT_TOKEN PRIVATE_GIT_USERNAME
          put backup B2_KEY_ID B2_APP_KEY BACKUP_ENCRYPTION_KEY
          put linode LINODE_CLI_TOKEN LINODE_ID_1 LINODE_ID_2
          put elasticsearch ES_BASE_URL ES_USER ES_PASSWORD
          put truenas TRUENAS_API_KEY TRUENAS_API_URL
          put postgres K8S_DB_NAME K8S_DB_USER K8S_DB_PASSWORD K8S_DB_PRIMARY K8S_DB_SECONDARY K8S_DB_TERTIARY
          put pihole PRIMARY_PIHOLE_IP_AND_PORT PRIMARY_PIHOLE_TOKEN
          [ "$problems" -eq 0 ] || exit 1

      - name: Revoke the Vault token
        if: always()
        run: '[ -n "${VAULT_TOKEN:-}" ] && vault token revoke -self >/dev/null && echo revoked || true'
