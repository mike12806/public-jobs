name: Vault Secrets Backup to B2

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: vault-backup-secrets
  cancel-in-progress: true

permissions:
  id-token: write  # log in to Vault through GitHub OIDC
  contents: read

env:
  VAULT_ADDR: https://vault.mfaherty.net

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Nothing but an OIDC token for the Vault login.
    permissions:
      id-token: write

    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd  # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: github-runner-vault-backup
          version: latest

      # Secrets come from Vault (kv/ci/*), logged in through GitHub OIDC with
      # the role below (gh_hdc vault/), so they're no longer GitHub secrets.
      - name: Read secrets from Vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc  # v4.0.0
        with:
          url: https://vault.mfaherty.net
          method: jwt
          path: github-actions
          role: public-jobs-vault-backup
          jwtGithubAudience: https://vault.mfaherty.net
          exportToken: true  # VAULT_TOKEN for this job's own Vault calls
          secrets: |
            kv/data/ci/backup B2_APP_KEY | B2_APPLICATION_KEY ;
            kv/data/ci/backup B2_KEY_ID | B2_APPLICATION_KEY_ID ;
            kv/data/ci/backup BACKUP_ENCRYPTION_KEY | ENCRYPTION_KEY

      - name: Cache B2 CLI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: /usr/local/bin/b2
          key: ${{ runner.os }}-b2cli-latest
          restore-keys: |
            ${{ runner.os }}-b2cli-

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y gnupg jq curl
          if ! command -v b2 &>/dev/null; then
            curl -fsSL -L https://github.com/Backblaze/B2_Command_Line_Tool/releases/download/v4.6.0/b2-linux -o /tmp/b2
            sudo install -m 0755 /tmp/b2 /usr/local/bin/b2
            rm /tmp/b2
          fi

      - name: Fetch, encrypt, and stage secrets from Vault
        run: |
          set -euo pipefail
          TIMESTAMP=$(date +%Y%m%d_%H%M%S)
          BACKUP_DATE=$(date +%Y/%m/%d)
          echo "BACKUP_FILENAME=vault_secrets_${TIMESTAMP}.json.gpg" >> "$GITHUB_ENV"
          echo "BACKUP_DATE=${BACKUP_DATE}" >> "$GITHUB_ENV"

          # Every secret in the kv mount (kv/kubernetes/<ns>/<name> for ESO,
          # kv/ci/* for workflows, ...) as one {"<path>": {<data>}} object,
          # walked through the metadata LIST API. Any failed request fails the
          # whole backup rather than leaving a secret out. Values stay in memory
          # and go straight into gpg; the log shows counts only (public repo).
          walk() {
            local prefix="$1" key
            curl -fsS --request LIST --header "X-Vault-Token: $VAULT_TOKEN" \
              "$VAULT_ADDR/v1/kv/metadata/${prefix}" | jq -r '.data.keys[]' |
            while read -r key; do
              if [[ "$key" == */ ]]; then
                walk "${prefix}${key}" || exit 1
              else
                curl -fsS --header "X-Vault-Token: $VAULT_TOKEN" "$VAULT_ADDR/v1/kv/data/${prefix}${key}" |
                  jq -c --arg path "${prefix}${key}" '{($path): .data.data}' || exit 1
              fi
            done
          }
          backup=$(set -o pipefail; walk "" | jq -cs 'add // {}')

          count=$(jq 'length' <<<"$backup")
          k8s=$(jq '[keys[] | select(startswith("kubernetes/"))] | length' <<<"$backup")
          echo "Fetched ${count} secrets (${k8s} under kubernetes/)"
          if [ "$count" -lt 2 ] || [ "$k8s" -lt 1 ]; then
            echo "::error::Backup looks incomplete; not uploading"
            exit 1
          fi

          # Pipe secrets directly through GPG without writing plaintext to disk
          gpg --batch --yes --passphrase-fd 3 -c \
              --output "vault_secrets_${TIMESTAMP}.json.gpg" \
              /dev/stdin \
            3<<<"$ENCRYPTION_KEY" <<<"$backup"
          unset backup

      - name: Upload to B2
        run: |
          set -euo pipefail
          b2 account authorize "$B2_APPLICATION_KEY_ID" "$B2_APPLICATION_KEY"
          b2 file upload secret-store-hdc "$BACKUP_FILENAME" "backups/${BACKUP_DATE}/$BACKUP_FILENAME"

      - name: Cleanup
        if: always()
        run: |
          b2 account clear 2>/dev/null || true
          rm -f vault_secrets_*.json.gpg
