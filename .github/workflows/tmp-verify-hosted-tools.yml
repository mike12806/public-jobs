name: tmp-verify-hosted-tools
on:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install Ansible
        env:
          ANSIBLE_VERSION: 14.5.0
          PIPX_HOME: ${{ runner.temp }}/pipx
          PIPX_BIN_DIR: ${{ runner.temp }}/pipx/bin
        run: |
          pipx install --include-deps "ansible==${ANSIBLE_VERSION}"
          echo "$PIPX_BIN_DIR" >> "$GITHUB_PATH"
      - name: Check Ansible
        env:
          ANSIBLE_PYTHON_INTERPRETER: /usr/bin/python3
        run: |
          set -x
          command -v ansible-playbook ansible-inventory
          ansible-playbook --version | head -3
          ansible-galaxy collection list 2>/dev/null | grep -E 'community.(crypto|general)|ansible.posix'
          ansible localhost -c local -m ping
          sshpass -V | head -1
          ssh -V
          /usr/bin/python3 -c 'import yaml; print("system yaml ok")'
      - name: Install the TrueNAS client (same pins as the NFS updater)
        run: |
          set -x
          TRUENAS_API_CLIENT_REF="$(grep -oE 'TRUENAS_API_CLIENT_REF="[0-9a-f]{40}"' .github/workflows/nfs-ip-security-list-updater.yml | cut -d'"' -f2)"
          WEBSOCKET_CLIENT_VERSION="$(grep -oE 'WEBSOCKET_CLIENT_VERSION="[^"]+"' .github/workflows/nfs-ip-security-list-updater.yml | cut -d'"' -f2)"
          sudo apt-get update -y
          sudo apt-get install -y jq curl python3 python3-pip
          sudo pip3 install --upgrade "git+https://github.com/truenas/api_client.git@${TRUENAS_API_CLIENT_REF}" "websocket-client==${WEBSOCKET_CLIENT_VERSION}"
          python3 -c "import truenas_api_client, websocket; print('truenas ok', websocket.__version__)"
      - name: Other tools the moved jobs call
        run: |
          set -x
          kubectl version --client
          jq --version; curl --version | head -1; gpg --version | head -1; git --version; rsync --version | head -1
          python3 -c 'import yaml; print("python3 yaml ok")'
          df -h / | tail -1
