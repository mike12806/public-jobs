name: "Vault: archive GitHub secrets"

# One-time: copies every GitHub Actions secret in this repo into Vault at
# kv/archive/github/public-jobs before the repo secrets are deleted (some
# were never used by a workflow, so nothing else copied them). Each value is
# read back and compared by checksum; the log shows names and ok only (this
# repo is public). Removed once it has run.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # Vault login through GitHub OIDC

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VAULT_ADDR: https://vault.mfaherty.net
      ROLE: public-jobs-archive
      ARCHIVE_PATH: kv/data/archive/github/public-jobs
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd  # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: github-runner-vault-archive
          version: latest

      - name: Archive the repo secrets in Vault
        env:
          ALL_SECRETS: ${{ toJSON(secrets) }}
        run: |
          set -euo pipefail
          jwt=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://vault.mfaherty.net" | jq -r .value)
          token=$(jq -n --arg jwt "$jwt" --arg role "$ROLE" '{role: $role, jwt: $jwt}' \
            | curl -fsS --data @- "$VAULT_ADDR/v1/auth/github-actions/login" | jq -r .auth.client_token)
          echo "::add-mask::${token}"
          trap 'curl -fsS -X POST -H "X-Vault-Token: ${token}" "$VAULT_ADDR/v1/auth/token/revoke-self" >/dev/null && echo revoked' EXIT
          # Every repo secret except the run's own GITHUB_TOKEN, as one entry.
          jq -c '{data: del(.github_token)}' <<<"$ALL_SECRETS" \
            | curl -fsS -H "X-Vault-Token: ${token}" --data @- "$VAULT_ADDR/v1/${ARCHIVE_PATH}" >/dev/null
          stored=$(curl -fsS -H "X-Vault-Token: ${token}" "$VAULT_ADDR/v1/${ARCHIVE_PATH}")
          problems=0
          for k in $(jq -r 'del(.github_token) | keys[]' <<<"$ALL_SECRETS"); do
            if [ "$(jq -r --arg k "$k" '.data.data[$k]' <<<"$stored" | sha256sum)" = "$(jq -r --arg k "$k" '.[$k]' <<<"$ALL_SECRETS" | sha256sum)" ]; then
              echo "  ${k}: ok"
            else
              echo "::error::${k}: MISMATCH"; problems=$((problems + 1))
            fi
          done
          echo "$(jq 'del(.github_token) | length' <<<"$ALL_SECRETS") secrets archived to ${ARCHIVE_PATH#kv/data/}"
          [ "$problems" -eq 0 ]
