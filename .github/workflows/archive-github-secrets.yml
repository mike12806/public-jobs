name: "Vault: archive GitHub secrets"

# One-time: copies every GitHub Actions secret in this repo into Vault at
# kv/archive/github/public-jobs before the repo secrets are deleted (some
# were never used by a workflow, so nothing else copied them). Each value is
# read back and compared by checksum; the log shows names and ok only (this
# repo is public). Removed once it has run.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # Vault login through GitHub OIDC

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      VAULT_ADDR: https://vault.mfaherty.net
      ROLE: public-jobs-archive
      ARCHIVE_PATH: kv/data/archive/github/public-jobs
    steps:
      - name: Connect to Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd  # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
          hostname: github-runner-vault-archive
          version: latest

      - name: Archive the repo secrets in Vault
        # Listed by name: a public repo won't run a job that takes
        # toJSON(secrets) without approval.
        env:
          ANSIBLE_SSH_PASSWORD_1: ${{ secrets.ANSIBLE_SSH_PASSWORD_1 }}
          ANSIBLE_SSH_PASSWORD_3: ${{ secrets.ANSIBLE_SSH_PASSWORD_3 }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_ENDPOINT_URL: ${{ secrets.AWS_ENDPOINT_URL }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          B2_APP_KEY: ${{ secrets.B2_APP_KEY }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          CF_CLIENT_ID: ${{ secrets.CF_CLIENT_ID }}
          CF_CLIENT_SECRET: ${{ secrets.CF_CLIENT_SECRET }}
          CF_ORGANIZATION: ${{ secrets.CF_ORGANIZATION }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ES_BASE_URL: ${{ secrets.ES_BASE_URL }}
          ES_PASSWORD: ${{ secrets.ES_PASSWORD }}
          ES_USER: ${{ secrets.ES_USER }}
          GH_HDC_PAT: ${{ secrets.GH_HDC_PAT }}
          K8S_DB_NAME: ${{ secrets.K8S_DB_NAME }}
          K8S_DB_PASSWORD: ${{ secrets.K8S_DB_PASSWORD }}
          K8S_DB_PRIMARY: ${{ secrets.K8S_DB_PRIMARY }}
          K8S_DB_SECONDARY: ${{ secrets.K8S_DB_SECONDARY }}
          K8S_DB_TERTIARY: ${{ secrets.K8S_DB_TERTIARY }}
          K8S_DB_USER: ${{ secrets.K8S_DB_USER }}
          KUBECONFIG: ${{ secrets.KUBECONFIG }}
          LINODE_CLI_TOKEN: ${{ secrets.LINODE_CLI_TOKEN }}
          LINODE_ID_1: ${{ secrets.LINODE_ID_1 }}
          LINODE_ID_2: ${{ secrets.LINODE_ID_2 }}
          MIKESSHKEYLINODEPUB: ${{ secrets.MIKESSHKEYLINODEPUB }}
          MIKEYSSHKEYLINODE: ${{ secrets.MIKEYSSHKEYLINODE }}
          PRIMARY_PIHOLE_IP_AND_PORT: ${{ secrets.PRIMARY_PIHOLE_IP_AND_PORT }}
          PRIMARY_PIHOLE_TOKEN: ${{ secrets.PRIMARY_PIHOLE_TOKEN }}
          PRIVATE_GITHUB_TOKEN: ${{ secrets.PRIVATE_GITHUB_TOKEN }}
          PRIVATE_GIT_TOKEN: ${{ secrets.PRIVATE_GIT_TOKEN }}
          PRIVATE_GIT_USERNAME: ${{ secrets.PRIVATE_GIT_USERNAME }}
          PVE2_SECRET: ${{ secrets.PVE2_SECRET }}
          PVE2_TOKEN_ID: ${{ secrets.PVE2_TOKEN_ID }}
          PVE3_SECRET: ${{ secrets.PVE3_SECRET }}
          PVE3_TOKEN_ID: ${{ secrets.PVE3_TOKEN_ID }}
          PVE4_SECRET: ${{ secrets.PVE4_SECRET }}
          PVE4_TOKEN_ID: ${{ secrets.PVE4_TOKEN_ID }}
          PVE5_SECRET: ${{ secrets.PVE5_SECRET }}
          PVE5_TOKEN_ID: ${{ secrets.PVE5_TOKEN_ID }}
          PVE6_SECRET: ${{ secrets.PVE6_SECRET }}
          PVE6_TOKEN_ID: ${{ secrets.PVE6_TOKEN_ID }}
          PVE7_SECRET: ${{ secrets.PVE7_SECRET }}
          PVE7_TOKEN_ID: ${{ secrets.PVE7_TOKEN_ID }}
          PVE_SECRET: ${{ secrets.PVE_SECRET }}
          PVE_TOKEN_ID: ${{ secrets.PVE_TOKEN_ID }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_USER: ${{ secrets.SSH_USER }}
          TRUENAS_API_KEY: ${{ secrets.TRUENAS_API_KEY }}
          TRUENAS_API_URL: ${{ secrets.TRUENAS_API_URL }}
          TS_ID: ${{ secrets.TS_ID }}
          TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          UDM_SSH_PASSWORD: ${{ secrets.UDM_SSH_PASSWORD }}
          VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
          SECRET_NAMES: ANSIBLE_SSH_PASSWORD_1 ANSIBLE_SSH_PASSWORD_3 AWS_ACCESS_KEY_ID AWS_ENDPOINT_URL AWS_REGION AWS_SECRET_ACCESS_KEY B2_APP_KEY B2_KEY_ID BACKUP_ENCRYPTION_KEY CF_CLIENT_ID CF_CLIENT_SECRET CF_ORGANIZATION EMAIL_FROM EMAIL_TO ES_BASE_URL ES_PASSWORD ES_USER GH_HDC_PAT K8S_DB_NAME K8S_DB_PASSWORD K8S_DB_PRIMARY K8S_DB_SECONDARY K8S_DB_TERTIARY K8S_DB_USER KUBECONFIG LINODE_CLI_TOKEN LINODE_ID_1 LINODE_ID_2 MIKESSHKEYLINODEPUB MIKEYSSHKEYLINODE PRIMARY_PIHOLE_IP_AND_PORT PRIMARY_PIHOLE_TOKEN PRIVATE_GITHUB_TOKEN PRIVATE_GIT_TOKEN PRIVATE_GIT_USERNAME PVE2_SECRET PVE2_TOKEN_ID PVE3_SECRET PVE3_TOKEN_ID PVE4_SECRET PVE4_TOKEN_ID PVE5_SECRET PVE5_TOKEN_ID PVE6_SECRET PVE6_TOKEN_ID PVE7_SECRET PVE7_TOKEN_ID PVE_SECRET PVE_TOKEN_ID SMTP_PASSWORD SMTP_PORT SMTP_SERVER SMTP_USERNAME SSH_HOST SSH_PRIVATE_KEY SSH_USER TRUENAS_API_KEY TRUENAS_API_URL TS_ID TS_OAUTH_CLIENT_ID TS_OAUTH_SECRET UDM_SSH_PASSWORD VAULT_TOKEN
        run: |
          ALL_SECRETS=$(jq -n '[$ARGS.positional[] as $k | {key: $k, value: (env[$k] // "")}] | map(select(.value != "")) | from_entries' --args $SECRET_NAMES)
          set -euo pipefail
          jwt=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=https://vault.mfaherty.net" | jq -r .value)
          token=$(jq -n --arg jwt "$jwt" --arg role "$ROLE" '{role: $role, jwt: $jwt}' \
            | curl -fsS --data @- "$VAULT_ADDR/v1/auth/github-actions/login" | jq -r .auth.client_token)
          echo "::add-mask::${token}"
          trap 'curl -fsS -X POST -H "X-Vault-Token: ${token}" "$VAULT_ADDR/v1/auth/token/revoke-self" >/dev/null && echo revoked' EXIT
          # Every repo secret except the run's own GITHUB_TOKEN, as one entry.
          jq -c '{data: del(.github_token)}' <<<"$ALL_SECRETS" \
            | curl -fsS -H "X-Vault-Token: ${token}" --data @- "$VAULT_ADDR/v1/${ARCHIVE_PATH}" >/dev/null
          stored=$(curl -fsS -H "X-Vault-Token: ${token}" "$VAULT_ADDR/v1/${ARCHIVE_PATH}")
          problems=0
          for k in $(jq -r 'del(.github_token) | keys[]' <<<"$ALL_SECRETS"); do
            if [ "$(jq -r --arg k "$k" '.data.data[$k]' <<<"$stored" | sha256sum)" = "$(jq -r --arg k "$k" '.[$k]' <<<"$ALL_SECRETS" | sha256sum)" ]; then
              echo "  ${k}: ok"
            else
              echo "::error::${k}: MISMATCH"; problems=$((problems + 1))
            fi
          done
          echo "$(jq 'del(.github_token) | length' <<<"$ALL_SECRETS") secrets archived to ${ARCHIVE_PATH#kv/data/}"
          [ "$problems" -eq 0 ]
