name: Reach the Kubernetes cluster
description: >-
  Tailscale up, kubectl installed, kubeconfig written, cluster proven
  reachable. Four jobs need exactly this and nothing about it varies between
  them, so it lives here rather than four times over.

inputs:
  ts-oauth-client-id:
    required: true
  ts-oauth-secret:
    required: true
  kubeconfig:
    description: >-
      base64-encoded kubeconfig. Leave empty to read it from Vault
      (kv/ci/kubernetes), which needs `id-token: write` in the calling
      workflow.
    required: false
    default: ""
  vault-role:
    description: Vault GitHub-OIDC role (gh_hdc vault/) used to read the kubeconfig.
    required: false
    default: public-jobs
  hostname:
    description: >-
      Tailscale hostname for this runner. Distinct per job so a node left in
      the tailnet is traceable to the job that created it.
    required: false
    default: github-runner-k8s

runs:
  using: composite
  steps:
    - name: Connect to Tailscale
      uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
      with:
        oauth-client-id: ${{ inputs.ts-oauth-client-id }}
        oauth-secret: ${{ inputs.ts-oauth-secret }}
        tags: tag:ci
        hostname: ${{ inputs.hostname }}
        version: latest
        timeout: 2m
        retry: 5
        use-cache: true

    # After Tailscale: vault.mfaherty.net is only reachable on the tailnet.
    - name: Read the kubeconfig from Vault
      if: inputs.kubeconfig == ''
      uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
      with:
        url: https://vault.mfaherty.net
        method: jwt
        path: github-actions
        role: ${{ inputs.vault-role }}
        jwtGithubAudience: https://vault.mfaherty.net
        secrets: kv/data/ci/kubernetes KUBECONFIG | KUBECONFIG_B64

    - name: Setup kubectl
      uses: azure/setup-kubectl@bda439f5f36b99b262ebdcd3613869bddb064c8e # v5.2.0
      with:
        version: "latest"

    - name: Set up kubeconfig
      shell: bash
      env:
        KUBECONFIG_B64: ${{ inputs.kubeconfig || env.KUBECONFIG_B64 }}
      run: |
        mkdir -p "$HOME/.kube"
        printf '%s' "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
        chmod 600 "$HOME/.kube/config"
        kubectl cluster-info || { echo "cannot reach cluster"; exit 1; }
